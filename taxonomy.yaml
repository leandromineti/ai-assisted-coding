# taxonomy.yaml — the sole machine-readable source of truth for this repo's taxonomy
# vocabulary. taxonomy.md is prose, linted against this file; Phase 2's lint reads this
# file directly. Do not duplicate vocabulary data (canonical terms, deny-lists,
# reference formats, carve-outs) anywhere else in the repo.
#
# decision_record below is the dated, immutable ADR that decided this vocabulary — if
# this file and the ADR's `## Decision` ever disagree, the ADR is wrong or this file is
# wrong; they must not diverge.

checked: 2026-08-19
decision_record: adrs/0015-layers-become-categories.md
canonical_top_level_term: categories

categories:
  - number: 1
    name: Models
  - number: 2
    name: Harnesses
  - number: 3
    name: Execution environments
  - number: 4
    name: Workflow frameworks
  - number: 5
    name: Extensions

# Canonical terms, each with a definition and a deny_list of banned synonyms (empty
# where nothing is banned). false_positive_notes records match forms that must NOT
# fail, with the live in-repo example — this is where "we already know this would
# misfire" knowledge lives, so Phase 2 builds the lint against it instead of
# rediscovering it.
terms:
  - term: categories
    definition: >-
      The taxonomy's top-level divisions (see the `categories` list above).
      Deliberately a non-stacking term — the owner's framing (ADR-0015, Context §1
      "The owner's driving argument"): "categories… a more general term that does
      not imply they are stacked (necessarily)."
    deny_list:
      - layer
      - layers
      - rung
      - rungs
      - ladder
      - cross-layer
    deny_list_exempt_compounds:
      - compound: "engagement ladder"
        canonical_source: >-
          ADR-0009's candidates ledger (candidate → stub → survey → deep-dive) — a
          graded-progression scale, unrelated to the taxonomy's top-level divisions.
        known_sites:
          - "notes/candidates.md:5"
          - "notes/04-workflow-frameworks/index.md:118"
      - compound: "enforcement ladder"
        canonical_source: >-
          ADR-0011's graded gate enforcement scale (engine/hook/script/prose) —
          unrelated to the taxonomy's top-level divisions.
        known_sites:
          - "notes/04-workflow-frameworks/gsd-core.md:191"
          - "notes/04-workflow-frameworks/gsd-core.md:193"
          - "notes/04-workflow-frameworks/gsd-core.md:375"
          - "notes/04-workflow-frameworks/bmad-method.md:105"
          - "notes/cross-cutting/feature-taxonomy.md:143"
      - compound: "capability ladder"
        canonical_source: >-
          Model reasoning-tier vocabulary (Anthropic's capability tiers) — unrelated
          to the taxonomy's top-level divisions.
        known_sites:
          - "notes/01-models/gpt-5-6-sol.md:30"
      - compound: "effort ladder"
        canonical_source: >-
          Model reasoning-tier vocabulary (effort levels none→max) — unrelated to
          the taxonomy's top-level divisions.
        known_sites:
          - "notes/01-models/gpt-5-6-sol.md:60"
    deny_list_exempt_note: >-
      Bare "rung"/"rungs"/"ladder" stay denied for the taxonomy-stacking sense (the
      old "five-rung ladder" framing this decision replaces). The compounds in
      deny_list_exempt_compounds name a different, already-canonical concept
      (graded-progression scales, each backed by its own ADR) and must not be
      flagged; known_sites lists every in-repo occurrence already verified against
      this exemption (Phase 2's lint should treat a denied match at one of these
      exact file:line sites, or matching one of these compound phrases, as exempt).
    false_positive_notes:
      - >-
        "cross-cutting" is untouched — it contains no banned word and is a distinct
        compound from "cross-layer" (which becomes "cross-category"); the two must
        not be conflated by the lint.
  - term: types
    definition: >-
      Category-5's sub-classification: the report frontmatter key `type:` (formerly
      `kind:`), and the concept previously also called "sub-category" elsewhere in
      taxonomy.md. Both old spellings fold into this one new term (ADR-0015 D-02).
    deny_list:
      - sub-category
      - sub-categories
      - "kind:"
    false_positive_notes:
      - >-
        The bare token `kind` (no colon) is deliberately NOT deny-listed — taxonomy.md
        alone carries three legitimate ordinary-English uses: line 6 "the same kind of
        thing", line 98 "the same kind of thing", line 346 "classifies by *kind*". A
        bare-token entry would guarantee false positives, which is exactly why the
        deny-list model was chosen over an allow-list. Only the frontmatter-key form
        `kind:` (with the colon) is banned.
      - >-
        The colon-qualified form `kind:` also has a known false positive:
        `notes/05-capability-extensions/ai-memory.md:90` reads "Table stakes in the
        kind: store + retrieve + MCP." — ordinary prose using "kind" followed by a
        list-introducing colon, not the report frontmatter key, and not inside
        backticks. Phase 2's lint must not flag this exact site; either scope the
        `kind:` match to frontmatter position (start-of-line, YAML key) or carve out
        this file:line explicitly.
  - term: bucket
    definition: >-
      Category 5's shape: a loose, cross-category collection, not a rung
      (ADR-0002). Canonical vocabulary, not drift.
    deny_list: []
    false_positive_notes:
      - >-
        `bucket` is not a synonym for `categories` and must not be swept toward
        "category" — the two terms name different things (a category's shape vs.
        the taxonomy's top-level divisions) and both stay in use.

# Words with one canonical sense and one drift sense that a lint cannot mechanically
# distinguish. Recorded here as an accepted gap: future misuse is caught by readers,
# not by the lint.
split_meaning_terms:
  - term: stack
    canonical_meaning: >-
      The running composed system: model + harness + environment (e.g. "human⇄stack
      boundary", "spanned stack").
    drift_meaning: >-
      Any classification use of "stack" — e.g. as a stand-in for the taxonomy's
      top-level divisions (the old `## The stack` heading, renamed to
      `## Tool categories` under this decision). This sense is drift, rewritten in
      the Phase 3 sweep.
    lint_enforceable: false
    reason: >-
      A lint cannot mechanically distinguish which sense a given occurrence of
      "stack" uses. Recorded as an accepted gap rather than a lint rule.

# Strict canonical numbered-reference forms. The lint enforces exact case, spacing,
# and separator — not merely denial of old forms; strict enforcement was chosen over
# deny-only for this file. Grounded in ADR-0015's Decision section, which fixes the
# numbering (per ADR-0007) and the five divisions' names as unchanged — this file is
# the source of truth for the exact reference syntax built on top of that.
reference_formats:
  prose: "category N"
  prose_example: "category 2"
  compound: "category-N"
  compound_example: "a category-2 problem"
  table_index: "N · Name"
  table_index_example: "2 · Harnesses"
  table_index_note: >-
    U+00B7 MIDDLE DOT with a single space on each side — not a hyphen, bullet, or
    other separator.
  enforcement: strict
  enforcement_note: >-
    The lint enforces exact case, spacing, and separator character for every form
    above, not merely the absence of old (layer-based) forms.

# Path patterns the lint uses to decide what is a current-state document (D-01, Phase 2).
# Patterns are matched with Python's fnmatch against the repo-relative POSIX path, where
# `*` crosses directory separators — so "upstream/*" covers the whole tree beneath it.
# Anything NOT matched here is current-state and is linted. No per-file markers, no date
# heuristics: this block is the single machine-readable exemption source.
exempt_paths:
  # Not lint targets at all.
  skip_entirely:
    - "upstream/*"      # other people's code — study clones, gitignored
    - ".git/*"
    - ".planning/*"     # planning docs discuss this vocabulary as the subject of decisions
    - "refs/*"          # source quotes legitimately use their authors' vocabulary
                        # (REQUIREMENTS.md "Out of Scope"); refs/ is not in SWEEP-01's list
    - "comparisons/*"   # generated — their generators own the vocabulary (methodology rule 3)
  # Append-only and preregistered records: immutable by methodology rule 5 (D-03).
  # experiments/rig/** is deliberately NOT here — the rig README is a living doc and is linted.
  append_only:
    - "experiments/0*/log.md"       # appended live during runs, never reconstructed
    - "experiments/0*/README.md"    # preregistered protocol text; results append below it
    - "experiments/*/artifacts/*"   # run artifacts, dated records of what actually happened
  # ADR bodies are exempt; the H1 title line of an ADR is still linted (D-04).
  body_exempt:
    - "adrs/*.md"
  # ...except these eight, whose titles were accepted before ADR-0015 and are immutable
  # per adrs/README.md — historical record, not fixable drift (enumerated 2026-08-19).
  # A NEW ADR whose title carries a banned term fails, which is what D-04 is for.
  adr_title_exempt:
    - "adrs/0001-five-layer-taxonomy.md"
    - "adrs/0002-extensions-demoted-to-bucket.md"
    - "adrs/0003-environments-stay-a-rung.md"
    - "adrs/0007-renumber-core-triad-first.md"
    - "adrs/0009-candidates-ledger.md"
    - "adrs/0012-layer-2-feature-set.md"
    - "adrs/0013-memory-features-block.md"
    - "adrs/0015-layers-become-categories.md"

# Match exemptions that apply to every deny-list entry (ADR-0015 § "The decoder";
# D-14). Named so Phase 2's lint can implement each one by id.
carve_outs:
  - id: adr-filenames
    description: >-
      Matches inside references to immutable ADR filenames do not fail — e.g.
      `0003-environments-stay-a-rung.md` legitimately contains "rung"; the filename
      is historically fixed, not prose drift.
  - id: inline-code
    description: >-
      Matches inside inline code spans (single backticks) do not fail — literal
      code identifiers and old-scheme references quoted as code are not prose drift.
  - id: adr-body-prose
    description: >-
      Matches inside adrs/*.md body text (including adrs/README.md's historical
      index rows) do not fail — ADRs are immutable after acceptance (adrs/README.md)
      and legitimately discuss banned terms as the subject of a rename decision, or
      record prior decisions in their own period vocabulary. Grounded in ADR-0015
      itself, whose own prose uses banned words in plain text (e.g. "not layers",
      "a five-rung ladder", "sub-categories") and would otherwise fail its own lint.
  - id: pre-sweep-material
    description: >-
      Material OUTSIDE this repo's current-state documents that predates the Phase-3
      sweep commit reads under the old vocabulary and is not a lint target: git history,
      preregistered experiment protocol text and log.md entries (immutable by methodology
      rule 5), article copies already published downstream, and old GitHub URLs. Narrowed
      2026-08-19 (Phase 2, D-02): "published article snapshots" means the downstream
      published copies only — the drafts in this repo's articles/ are current-state
      documents, linted and swept like any other (SWEEP-01). This carve-out never exempts
      a file merely because it was written before the sweep; the exempt file paths are
      enumerated in exempt_paths above and nothing else is exempt — a carve-out that
      exempted everything pre-dated would leave the sweep nothing to fix. ADR-0015's own
      "The decoder" section states the boundary in its words, verbatim: "Git history,
      experiment protocols and logs (immutable by methodology rule 5), published article
      snapshots, and old GitHub URLs predating the sweep also read under the old
      vocabulary, by the same boundary."

# The D-02/D-03 frontmatter key renames as machine-readable data, so Phase 3 executes
# a recorded contract rather than a memory. Both renames must land in one commit —
# renaming either side alone (generator vs. report frontmatter) breaks the generator.
schema_renames:
  - old: layer
    new: category
    scope:
      - "report frontmatter key `layer:` (~38 tool reports)"
      - "notes/_template-tool-report.md"
      - "notes/01-models/_template-model-report.md"
      - "scripts/build-tool-index.py"
    note: >-
      Values 1-5 are unchanged — purely a key rename (D-03). 40 files under notes/
      carry a `layer:` frontmatter key (ADR-0015 Sequencing), matching
      `grep -rl "^layer:" notes/ | wc -l`; the 40th is
      notes/01-models/_template-model-report.md, easy to miss because it is not
      named in ADR-0015's Sequencing prose (which only mentions the singular
      notes/_template-tool-report.md). This template also carries a
      `## The layer-1 axes` heading, which renames alongside its `layer:` key.
    executes_in: phase-3
    # Dormancy switch (Phase 2 decision). `pending` = the OLD key is still the current
    # schema: the lint accepts it and fails a premature NEW key, because renaming one side
    # alone breaks the generator (ADR-0015 § Sequencing). Phase 3 flips this to `applied`
    # in the same atomic commit that renames generator + template + report frontmatter,
    # after which the lint fails any surviving OLD key as an unapplied decoder (LINT-05).
    status: pending
    atomic: true
  - old: kind
    new: type
    scope:
      - "report frontmatter key `kind:` in category-5 reports"
      - "notes/_template-tool-report.md"
      - "scripts/build-tool-index.py"
    note: >-
      Category-5 sub-classification values are unchanged — purely a key rename
      (D-02). Scoped to tool reports only; distinct from refs' own unrelated `kind:`
      vocabulary in scripts/build-refs-index.py (source kind: paper/benchmark/
      blog-post), which is never renamed.
    executes_in: phase-3
    status: pending
    atomic: true
