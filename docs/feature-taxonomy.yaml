# feature-taxonomy.yaml — the machine-readable half of the FEATURE taxonomy: every
# characteristic assessed on a tool, defined once with its applicability and value type.
# Its prose half is feature-taxonomy.md; the tool taxonomy (what a tool IS) is the other
# pair, tool-taxonomy.{md,yaml} — two taxonomies, ADR-0010. Split out of the .md's fenced
# block 2026-08-26 (ADR-0036) so it is a real YAML file: no fence extraction, editor
# tooling works, and consumers derive their vocabulary from it instead of hardcoding it.
#
# Read by scripts/build-tool-index.py (matrices + the rendered registry),
# scripts/check-taxonomy.py (unregistered-key gate), and scripts/build-db.py.
# Do not hand-edit comparisons/feature-registry.md — it is this file, rendered.

# --- groups (added 2026-08-26, ADR-0045) — what TEACHES the reader ---------------
# Every entry in both lists below carries a `group:`. Groups exist for the reader, not
# for the schema: the registry renders one subsection per group instead of one flat
# table per category (28 rows for harnesses, 23 for memory — derived from the rendered
# registry sections, re-counted 2026-09-04), and each group's `blurb`
# says what the group is ABOUT and how its keys read together. The division of labour
# is deliberate — feature-registry.md's intro teaches NOTATION (presence vs graded,
# omitted vs false, the three verification routes), and these blurbs teach SUBJECT
# MATTER. Neither repeats the other, and neither repeats a key's own `definition`.
#
# Groups span the placement test on purpose: `identity` holds transcribed fields,
# `reasoning` holds assessed keys, `cost` holds both. The Basis column is what marks
# that boundary — row position never was.
#
# `order` sorts groups within a category section AND orders the matrix columns, since
# features[] entries are physically stored in group order (build-tool-index.py builds
# HARNESS_FEATURE_KEYS and its four siblings from registry entry order). A group's
# applies_to is DERIVED from its members, never declared — one less thing to drift.
#
# WITHIN a group, rows render transcribed-first then assessed, and each list in the order
# it is written here — so a group's facts come before what was judged about them. `cost`
# is the only group mixing both today and it is the case that settles the rule: `pricing`
# is the base rate, and `prompt_caching` / `batch_discount` exist only to move it.
groups:
  - id: identity
    title: Identity
    order: 10
    blurb: >-
      Who made the thing, what you may do with it, and what exactly you are looking at.
      `maker` and `license` are the two most often assumed rather than read — a maker's
      name drifts in spelling until one maker reads as two, and a license is a file in a
      repo, not a reputation. Read `license` and `access` as a PAIR: the first says under
      what terms, the second what you can actually obtain, and only together do they
      separate open source from source-available from closed (ADR-0044).
  - id: provenance
    title: Provenance
    order: 20
    blurb: >-
      How re-checkable everything else in the report is. `commit` is the one
      machine-checked pin per report — every claim in it was read at that tree, and
      `build-tool-index.py --check` fails when it stops resolving. `stars` and
      `first_commit` are script-collected, never hand-typed, and describe the CURRENT
      repo only: a fork or an org move strands the predecessor's history while keeping
      its commits. A pin that has drifted is a work queue, not a failure — but a claim
      whose pin no longer resolves cannot be checked at all.
  - id: shape
    title: Shape
    order: 30
    blurb: >-
      What the subject is built from, and where you meet it. `stack` is the language and
      runtime you would have to read to verify anything deeper than a README claim.
      `surfaces` and `execution` say whether you meet the tool in a terminal, an IDE, a
      desktop app or a browser, and whether the work runs on your machine or someone
      else's. `harness_targets` asks the reverse question for categories 4–6 — which
      harnesses the thing installs into — and lists only verified install paths.
  - id: capacity
    title: Capacity
    order: 40
    blurb: >-
      What the model can hold, and how current what it knows is. `context_window` and
      `max_output` are the vendor's ADVERTISED numbers, not measured ones: usable-versus-
      advertised context is a category-1 axis, evidenced in the report rather than here.
      `knowledge_cutoff` is the outer bound on training data, and it is null when the
      vendor publishes none — five of eleven do not, which is why the cell carries its own
      `basis` and a required note rather than a bare dash (ADR-0037/0038).
  - id: cost
    title: Cost
    order: 41
    blurb: >-
      What it costs, and the two levers that move that. `pricing` carries a BASE RATE —
      a small, standard, non-batch, uncached request on the vendor's first-party USD
      surface — precisely so the numbers compare across vendors; everything two numbers
      cannot hold (tier boundaries, off-peak windows, sibling variants) lives in `regime`
      and a dated note. `prompt_caching` and `batch_discount` exist only to move that base
      rate, and both stay in the vendor's own words because the economics differ
      structurally: a 0.1x read with a 5-minute TTL is not comparable to a flat 50% off
      asynchronous work.
  - id: reasoning
    title: Reasoning
    order: 42
    blurb: >-
      Whether the model produces reasoning tokens, and who controls how many. Read the
      three keys together, because each answers a different question: `reasoning` ✓ only
      says such tokens are generated, `reasoning_type` says whether you can turn them off
      (always-on · default-on · opt-in · none), and `reasoning_effort` says who SIZES
      them — a level set the model spends against (`levels:…`) or a token budget the
      caller allocates up front (`budget:…`). A ✓ beside `always-on` and a budget dial is
      a very different bill from a ✓ beside `opt-in`; reasoning tokens bill as output.
  - id: wire-behavior
    title: Wire behavior
    order: 43
    blurb: >-
      What the sweep actually observed the live wire do, as distinct from what a vendor
      documents or what a request merely gets accepted. Every cell in this group is a
      DEFAULT-MODE wire observation — a rate or a verdict token dated `OBSERVED`, citing the
      classified evidence it was read from and the ADR that promoted it (ADR-0050). The
      thinking-mode cross-product (firing the same cells again at `thinking-on`/`thinking-off`)
      is a named, dated deferral, not a silent scope choice: `probes/PREREGISTRATION.md`'s own
      `### Mode scope` section (added 2026-09-02) resolves it explicitly for this evidence
      base. A future thinking-mode run widens a key's domain; it does not change the cell
      grammar these keys already fix.
  - id: environment-binding
    title: Environment binding
    order: 50
    blurb: >-
      The bleed: where a harness runs the agent's work, and how tightly it is tied to that
      place. `environments` lists only VERIFIED category-3 bindings. `environment_relation`
      says which of four postures the tool takes — bundle (ships one), bind (drives someone
      else's), internalize (built its own), inhabit (detects the one it is already inside).
      It is deliberately left unset when none of the four fits, and that null is data.
  - id: extension-points
    title: Extension points
    order: 51
    blurb: >-
      What can be plugged into the harness, and how the model reaches past its own context.
      `mcp`, `lsp` and `hooks` are the wire-level ports — other processes the harness
      speaks to; `skills`, `subagents` and `rules_files` are instruction-level — text and
      isolated agents the model is given. `ptc` is a different shape from both: model-
      emitted code drives tools inside a sandboxed runtime, instead of one chat-loop tool
      call at a time. A `·` in this group is not a no; these keys are set only where the
      mechanism was found in source or official docs.
  - id: control-gates
    title: Control gates
    order: 52
    blurb: >-
      Where a human or the engine can stop the agent. Three of the keys mark three
      different moments in a turn: `plan_mode` before the work starts, `tool_approval`
      before a tool call runs, `turn_end_gates` when the model tries to end its turn. The
      fourth, `headless_approval`, cuts across all of them by asking a different question —
      not *when* the gate fires but *what it decides when nobody is there to answer*, which
      is the condition every CI run and scripted invocation meets and every demo does not.
      `turn_end_gates` is GRADED rather than ✓/✗ (engine > hook > script > prose, strongest
      verified enforcer wins) because who enforces a gate is the finding — a gate compiled
      into the engine and a gate written into a prompt are not the same gate, and that gap
      is what conclusion 8 measures. Read the four together and the group's real subject
      appears: a gate is only as strong as its weakest condition, so a ✓ on `tool_approval`
      says a prompt exists and `headless_approval` says whether that prompt survives contact
      with automation.
  - id: operations
    title: Operations
    order: 53
    blurb: >-
      What living with the harness is like. `model_agnostic` says whether you can bring
      your own weights; `session_sharing` whether a session can leave the machine, as a
      link (which implies a hosted surface) or a portable export — the report's cell says
      which; `evals` whether it ships scoring for MODELS AND AGENTS, where a unit-test
      suite explicitly does not count; `learning_loop` whether the agent writes memory or
      skills of its own accord, which is the demand side of the whole category-5 supply.
  - id: boundary
    title: The boundary
    order: 60
    blurb: >-
      The sandbox itself: what the wall is made of, whose hardware it stands on, and how
      long you wait for one. `isolation_primitive` names the mechanism — a microVM, a
      container, a kernel namespace — and every other guarantee in this category is capped
      by how strong it is. `self_host` says whether you can run the thing on your own
      infrastructure at all; `warm_pool` whether a sandbox is kept waiting, which is the
      difference between a sub-second start and a cold boot on every agent turn.
  - id: crossing
    title: What crosses it
    order: 61
    blurb: >-
      What is allowed through the wall, in both directions. `egress_default` is the single
      most consequential cell in this category — whether a fresh sandbox can reach the
      network before anyone configures anything — and `egress_controls` says what you can
      do about it. `credential_model` is the inbound half of the same question: how secrets
      get in, and what holds them there. Read an open default as a fact about YOUR posture,
      not the vendor's.
  - id: persistence
    title: What persists
    order: 62
    blurb: >-
      What survives the sandbox. `snapshot_model` says whether a running machine's state
      can be captured and restored, which is what makes a long agent run resumable rather
      than restartable. `filesystem_sync` says how the working directory gets its contents
      in the first place — mounted, cloned, or uploaded — and that choice decides whether
      an interrupted run picks up where it left off.
  - id: spine
    title: The spine
    order: 70
    blurb: >-
      The framework's actual shape: what it takes in, what carries state between steps, and
      whether anything comes back out. `intent_pipeline` is the ordered path from intent to
      code (a `/prd → /spec → /build` chain); `deterministic_engine` says whether anything
      OUTSIDE the model enforces that path; `state_store` names where phase state lives;
      `retrospectives` whether finished work feeds anything forward. A framework that is
      prose all the way down still has a spine — it just has no engine holding it up.
  - id: verification-gates
    title: Verification gates
    order: 71
    blurb: >-
      Three questions a framework can ask before letting work pass, in ascending order of
      what they cost to fake: does the output have the right SHAPE (`format_gates`), do the
      tests and types actually PASS (`measured_gates`), was the PROCESS followed
      (`process_gates`). All three are graded (engine > hook > script > prose) rather than
      ✓/✗, because a gate is only as strong as whatever enforces it — a bare `true` is an
      explicit unanswered who-enforces question, not a pass.
  - id: orchestration
    title: Orchestration
    order: 72
    blurb: >-
      How the framework spends context and parallelism. `context_isolation` says whether
      sub-work runs in its own window instead of filling the main one; `parallel_orchestration`
      whether independent work runs at the same time, typically over git worktrees. They
      tend to arrive together, because isolating context is what makes parallel agents safe
      to run at all.
  - id: store-scope
    title: Store & scope
    order: 80
    blurb: >-
      Where memories live and who can see them. `memory_store` names the substrate — a file
      tree, a vector index, a graph, a relational database, or several at once — and
      `memory_tiers` whether short- and long-lived memory are distinguished at all.
      `memory_scope` is the blast radius (session · project · user · organisation), and
      `deployment_mode` says whether the store runs locally or as someone else's service,
      which is a privacy question before it is an architecture one.
  - id: write-path
    title: Write path
    order: 81
    blurb: >-
      How something becomes a memory, and how it stops being one. `capture_path` says what
      triggers a write — an explicit command, an inferred decision, a background pass — and
      `write_admission` whether anything stands between a candidate and the store.
      `memory_revision` and `decay` are the far end: whether a wrong memory can be corrected,
      and whether an old one loses weight on its own. A system with no admission and no decay
      accumulates its errors permanently.
  - id: read-path
    title: Read path
    order: 82
    blurb: >-
      How a stored memory reaches the model. `recall_injection` says WHEN — always in the
      prompt, on a tool call, on a retrieval hit — and `hybrid_retrieval` whether more than
      one retrieval strategy is combined. `injection_trust_boundary` is the security key of
      this category: recalled text arrives in the model's context wearing the same clothes
      as the user's instructions, and this cell says whether the system marks that seam at
      all.
  - id: integration
    title: Integration
    order: 83
    blurb: >-
      How the memory system meets the harness. `harness_installer` says whether it ships an
      install path rather than leaving you to wire it up; `rule_extraction` whether it can
      turn accumulated memory into standing instructions — which is the point where a memory
      tool starts doing a workflow framework's job, and the reason the two categories bleed.
      `memory_import` is the switching-cost key: whether you can arrive with memory you
      already have, the in-direction mirror of the displacement moves some tools make
      against a harness's native store.

features:
  # --- harness block (`harness_features:`), applies to category 2 ---
  - id: mcp
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: MCP client support
    kind_link: mcp-server
  - id: lsp
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: language-server integration
  - id: hooks
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: deterministic lifecycle hooks / plugin triggers
    kind_link: hook
    note: "supply side also carries category-4 verification mechanisms — ECC finding: gates can arrive as installable Stop hooks"
  - id: skills
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: on-demand packaged instructions
    kind_link: skill
  - id: subagents
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: spawnable isolated agents
    kind_link: subagent-def
  - id: ptc
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: >-
      programmatic tool calling — model-emitted code drives tools in a sandboxed runtime
      instead of chat-loop tool calls. SHARPENED 2026-08-27: a code-execution TOOL reached
      through the normal loop is not PTC, however capable. The test is whether the emitted
      code drives the harness's OWN tool dispatch — near-miss on the qwen-code read, whose
      packages/node-repl ships a session-persistent Node REPL as a standalone MCP server
      ("fully independent of core — any MCP client … can run it"), i.e. code execution
      arriving as one more tool call
    note: "added 2026-08-18 per ADR-0012, resolving issue #3 (hermes execute_code, iteration-refunded; codex code-mode in sandboxed V8); open mechanism question: do models actually use it?"
  - id: rules_files
    group: extension-points
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: standing-instruction files (value may list filenames)
    kind_link: rules-file
  - id: turn_end_gates
    group: control-gates
    block: harness_features
    applies_to: [2]
    value_type: graded
    definition: "native turn-end verification/stop gate — the harness can veto or re-prompt the model's attempt to end its turn; GRADED per ADR-0011/0012: engine | hook | script | prose | true | false"
    kind_link: hook
    note: "added 2026-08-18 per ADR-0012 (hermes verification_stop = engine; codex run_turn_stop_hooks should_block = hook) — conclusion 8's core leg, previously column-less; graded because harness gates at engine/hook vs framework gates at prose/script IS the absorption finding"
  - id: tool_approval
    group: control-gates
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: "per-tool human approval at dispatch — the harness can ask before executing a tool call; distinct from sandbox bounds (the environment_relation field) and from turn gates (turn_end_gates)"
    note: >-
      added 2026-08-25 after the dsh deep-dive supplied the first verified absent (its tools/pre-
      execute default is allow; the sole prompt in a stock run is a model-initiated sandbox
      escalation) — the axis discriminates: 6 present / 2 absent as of 2026-08-26, all transcribed
      from the category-2 index's absorption table at their pins. Warp's present carries the
      AgentDecided caveat (a model-authored is_risky:false self-authorizes). The two absents (dsh,
      pi) take OPPOSITE philosophies and that is the discriminating finding: dsh moves the gate down
      a level to a compiled per-call OS sandbox; pi removes it entirely (no permission system, no
      sandbox, runs as the launching user, confinement delegated to external containerization by
      docs — pi.md, 2026-08-26). gemini-cli's present is the strongest form: a tiered TOML policy
      engine, ASK_USER default, plus a one-way LLM-authored checker (CONSECA). COUNTER-INSTANCE
      2026-08-27 (qwen-code), which relocates the boundary Warp's caveat seemed to draw: its AUTO
      mode runs an LLM classifier that returns `shouldBlock` only — no vocabulary for allowing
      anything — and documents `unavailable` (API error, timeout, schema failure, context overflow)
      as MUST-block, so it fails closed. Its engine also strips user allow-rules broad enough to
      defeat the classifier (permission-manager.ts:1512), the only tracked gate that defends itself
      from the OPERATOR. So model-in-the-gate is not the defect; model authority that can WIDEN a
      permission is. Warp ✓-with-caveat and qwen-code ✓ are the two poles of the same mechanism —
      and continue is the third instance of the monotonic clamp that resolves them, arrived at
      independently for a NON-model evaluator (gui/src/redux/thunks/evaluateToolPolicies.ts:56-64:
      a dynamic per-argument result may tighten, never loosen; `disabled` is unoverridable; an
      evaluator error resolves to `disabled`). COLUMN COMPLETED 2026-08-27 by the issue-#35 probe
      (cline, continue) — 12 of 12 harness reports set, 10 present / 2 absent, the first assessed key
      in this category with no honest dots left. cline's ✓ carries the reverse of Warp's caveat and
      is the reason the presence bool is thin here: the gate is a property of the SURFACE, not the
      engine. Its SDK checks `autoApprove === false` against an optional field and ships `{}` as the
      default policy — upstream's own words, "The SDK defaults unlisted tools to auto-approved"
      (apps/vscode/src/sdk/sdk-tool-policies.ts:7) — so VS Code turns the gate on by forcing
      autoApprove:false across five tool families while the CLI turns it off
      (defaultToolAutoApprove = true, apps/cli/src/main.ts:868). One tool, one ✓, two opposite
      out-of-the-box postures
  - id: headless_approval
    group: control-gates
    block: harness_features
    applies_to: [2]
    value_type: closed-enum
    definition: >-
      what the permission gate resolves to when NO HUMAN CAN ANSWER — deny | allow. Scoped to
      harnesses that HAVE a gate (`tool_approval: true`); left unset where none exists, and that
      null is data rather than a gap (dsh substitutes a compiled sandbox, pi substitutes nothing).
      DISTINCT FROM `tool_approval`, which says only whether a prompt exists: two harnesses can
      both be ✓ and take opposite decisions the moment the terminal is a pipe, which is the
      condition every CI run, cron job, and scripted invocation actually meets. Read it as the
      gate's failure mode, not its strength — `allow` is fail-open, `deny` is fail-closed.
    note: >-
      added 2026-08-27 from the aider deep-dive, which supplied the second verified instance and
      the opposite value from gemini-cli's. aider is `allow`: confirm_ask's signature default is
      "y" (io.py:810), no agent-loop call site overrides it, and the EOF handler treats end-of-input
      as "the user pressed Enter" (io.py:884-886) — so all seven gates auto-approve under
      `aider -m` with no TTY. gemini-cli is `deny`: ASK_USER interactive / DENY headless when no
      rule matches (policy-engine.ts:291-293). The pair is what makes the key discriminate, and
      aider adds a second-order finding recorded in its report body rather than here — its
      `--yes-always` flag is STRICTER than its absence, because the shell gate passes
      explicit_yes_required=True and io.py:866-867 turns blanket-yes into an automatic "no" for
      model-authored commands. So on aider the safety flag is the safe setting and the unattended
      default is not. EXTENDED 2026-08-27 by the issue-#35 probe (cline dc175c73a, continue
      5522c6f44), which doubled the key to 4 set — 2 deny, 2 allow — and named the mechanism
      behind each value rather than just the value. cline is `deny` twice over: no TTY on stdin
      OR stdout returns approved:false before any prompt is drawn (apps/cli/src/utils/approval.ts:68-73),
      and its SDK denies again when no approval callback is configured (agent-runtime.ts:1429-1434).
      continue is `allow` in the key's most literal form: getDefaultToolPolicies(isHeadless) appends
      `*: allow` + `Bash: allow` where the TUI branch appends `ask` for both
      (extensions/cli/src/permissions/defaultPolicies.ts:30-37) — the absence of a human IS the
      condition, and upstream documents it (permissions/README.md:16). continue also supplies a
      THIRD mechanism the enum has no word for and that the definition should not be stretched to
      cover: Edit/MultiEdit/Write stay pinned `ask`, and headless does not decide them, it WITHDRAWS
      them — ask-tools are filtered out of the schema sent to the model (stream/handleToolCalls.ts:187-191).
      Withdrawal is not a third value; it is why continue's `allow` is fail-open only over a reduced
      tool set, which belongs in the report body. Read together, the four instances say the value
      tracks NOTHING structural — aider and continue reach `allow` by opposite routes (an EOF default
      vs. a deliberate headless branch), cline and gemini-cli reach `deny` by opposite routes (a TTY
      check vs. a policy-engine default). Every other report leaves this unset (not checked, or no
      gate to check).
  - id: plan_mode
    group: control-gates
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: built-in plan/act split
    note: "shape diverges across verified instances — enforced MODE (claude-code, opencode, cline) · tool (codex) · bundled skill (hermes) · per-query FLAG (warp, 2026-08-19: /plan sets UserQueryMode::Plan on that one submission, no sticky state, planning_enabled always on server-side) — but only `mode` has ≥2 instances, so the enum promotion is deferred (ADR-0012, tracked with issue #13)"
  - id: model_agnostic
    group: operations
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: bring-your-own-model by design
  - id: session_sharing
    group: operations
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: "a session leaves the machine as a shareable link (implies a hosted surface) or a portable exported artifact — the report's cell comment says which form"
    note: "definition sharpened 2026-08-25 — dsh forced the call (ZIP export + resume present, share links verified absent); the old 'links/artifacts' disjunction hid exactly that distinction"
  - id: evals
    group: operations
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: "ships its own model/agent evaluation harness — task-success or output-quality scoring; software test suites and coverage gates do not count"
    note: >-
      sharpened 2026-08-25 — the dsh near-misfire: 872 unit specs and per-file 100% coverage
      but zero model evals; the old wording did not exclude software tests. SECOND near-miss
      2026-08-27 (qwen-code), and a DIFFERENT edge worth keeping separate: memory/
      recall-eval.test.ts is a genuine measurement harness — labeled corpus, Recall@5, a
      frozen reference scorer kept for regression comparison — that scores the DETERMINISTIC
      selector and says so, the model selector being left to mocked cases. dsh's edge was
      "tests are not evals"; this one is "measures something, but not the model or the
      agent." Verified absent: git ls-files "*.eval.ts" → 0, against gemini-cli's 37
  - id: learning_loop
    group: operations
    block: harness_features
    applies_to: [2]
    value_type: presence
    definition: AUTONOMOUS agent-written memory/skills (background/spawned write path) — distinct from `skills` and from user-curated memory files
    kind_link: memory
    note: >-
      added 2026-07-30 per issue #2's two-verified-instances rule (hermes, codex); note default-on
      vs default-off when setting. 2026-08-19: four mechanism shapes now verified — hermes
      background fork (on) · codex pipeline (off) · claude-code in-loop · warp propose-and-commit (a
      verified ✗ whose write path is agent-proposed, human-committed; deprecated is_autogenerated
      shows an auto-write path removed) — promotion spec ready, issue #13. FIFTH shape 2026-08-27
      (qwen-code): background extraction plus a "dream" consolidation agent, both DEFAULT-ON
      (config.ts:1333-1335) and auto-applying through atomicWriteFile into the store recall reads.
      At 4 ✓ / 4 ✗ this is the block's most balanced axis, and the balance makes the real
      discriminator legible: two of the four ✗ (gemini-cli, warp) have an autonomous write path and
      are ✗ because it is PROPOSE-AND-COMMIT, not because it is absent. The key turns on auto-apply,
      not on the mechanism existing — and qwen-code is the first ✓ that is default-on as well as
      auto-applying, which is also a default-on token bill
  # --- category-1 block (`model_features:`), ADR-0014 — verified against the report's
  # `url` on its `checked` date. The two economics keys stay free-text (vendor economics
  # differ structurally); the three reasoning keys are typed (ADR-0040) ---
  - id: prompt_caching
    group: cost
    block: model_features
    applies_to: [1]
    value_type: free-text
    definition: write/read economics + TTLs, in the vendor's own terms
    note: "folded 2026-08-19 (ADR-0014)"
  - id: batch_discount
    group: cost
    block: model_features
    applies_to: [1]
    value_type: free-text
    definition: async batch pricing, if offered
    note: "folded 2026-08-19 (ADR-0014)"
  - id: fast_mode
    group: cost
    block: model_features
    applies_to: [1]
    value_type: presence
    definition: "the first-party API offers a paid option to serve THIS model at higher output-token throughput, whatever the vendor calls it (fast mode, priority serving). A faster SIBLING model does not count, and neither does a capacity/SLA commitment that claims no token-speed gain"
    note: "added 2026-08-27 (ADR-0049), owner-requested as a boolean. batch_discount's inverse: batch is slower-for-cheaper, this is faster-for-pricier — the premium and mechanism live in each report's cell comment and prose, not here. First sweep 3 ✓ / 9 ✗ / 1 · over 13 models, and the split carries a finding: the ✓s are exactly Anthropic (fast mode, `speed: fast`, 2.5x OTPS at 2x price, Opus-only), OpenAI (`service_tier: fast|priority` — priority RENAMED to fast mode 2026-07-30), and Google (Priority tier, ~1.8x); every non-Western maker checked lacks one, and two of the three ✓ vendors converged on the same product name within a month"
  - id: reasoning
    group: reasoning
    block: model_features
    applies_to: [1]
    value_type: presence
    definition: "the model generates reasoning tokens at all — true even when reasoning cannot be switched off; the vendor's own word (thinking | reasoning) is not the test"
    note: "added 2026-08-26 (ADR-0040), splitting the old free-text `thinking` key. Weak discriminator BY DESIGN and recorded as such: 10 present / 1 absent across the sweep, the lone ✗ being qwen3-coder-next ('supports only non-thinking mode') — re-counted 2026-08-27 as 12 present / 1 absent of 13, the same lone ✗, after the two Qwen3.8 models were added. Kept anyway because it is the base fact the other two are conditional on, and because a non-reasoning model is a thing that ships again — but do not mistake it for a measurement"
  - id: reasoning_type
    group: reasoning
    block: model_features
    applies_to: [1]
    value_type: closed-enum
    definition: "TOGGLEABILITY: always-on (cannot be disabled) | default-on (on unless disabled per request) | opt-in (off unless requested) | none"
    note: "added 2026-08-26 (ADR-0040). Toggleability, NOT Anthropic's adaptive-vs-extended axis — that axis is who SIZES the reasoning and it surfaces in `reasoning_effort`'s family (levels: vs budget:). Toggleability won the enum because every vendor states it: 9/11 settled from the existing record at the reshape, 11/11 the same day once issue #38 read Anthropic's per-model thinking table. KNOWN STRAIN (2026-08-26): claude-opus-5 is `default-on` only CONDITIONALLY — `thinking: {type: disabled}` is accepted at effort ≤ high and 400s at xhigh/max, so toggleability there is a function of another request parameter, not a static model property. Recorded in the report; revisit the enum if a second vendor ships the same shape (issue #2's two-instance bar)"
  - id: reasoning_effort
    group: reasoning
    block: model_features
    applies_to: [1]
    value_type: open-descriptive
    definition: "the caller-facing depth dial, `family:specific` (ADR-0017 shape) — `levels:<set>@<default>` | `budget:<unit>` | `none`. The family says who sizes the reasoning: a level enum the model spends against, or a token budget the caller allocates up front"
    note: "added 2026-08-26 (ADR-0040), replacing the free-text `effort_control`. NOT a presence-claim: a boolean would have been 10 ✓ / 1 ✗ with the ✗ on the same row as `reasoning`'s — the same column twice, and rule 5d says an instrument that cannot discriminate cannot measure. The variation is in the level set (four distinct shapes) and the default: `@high` mostly, `@medium` at OpenAI, `@max` at kimi-k3 and glm-5.3 — which is why the default lives in the cell and not in body prose"
  - id: seed_determinism
    group: wire-behavior
    block: model_features
    applies_to: [1]
    value_type: string
    definition: "whether repeated requests carrying the same seed value produce byte-identical output, expressed as a match rate over repeated same-seed pairs. Rate head cell: `<N>/<M> same-seed pairs (<verdict>)`, verdict one of `varies` | `no-signal`, or the not-applicable form for a model with no request-side seed field"
    note: "promoted 2026-09-03 (ADR-0050). BHV-01: `seed` is uniformly accepted-unverified at the contract layer across its 8-model domain — a flat cell on its own — and uniformly 0/5 behaviorally; only the combined contract-plus-behavioral picture discriminates (D-01), since acceptance alone reads as a non-varying key"
  - id: sampling_repeatability
    group: wire-behavior
    block: model_features
    applies_to: [1]
    value_type: string
    definition: "whether repeated identical requests produce identical output under a fixed sampling configuration — either an explicit temperature:0 request where the model accepts one, or the model's own default (implicit) configuration where it rejects temperature outright in default mode (the `default-config-repeatability` substitute design, built so a temperature-rejecting model still answers the closest question its own accepted request surface allows). Rate head cell: `<N>/<M> repeat pairs (<verdict>)`, verdict one of `deterministic` | `partial` | `varies` | `no-signal`; the design that fired is always named in the cell's tail, never left to be inferred from the model name"
    note: "promoted 2026-09-03 (ADR-0050). BHV-02: all 12 probed models get a cell — 7 real temperature:0 tests, 5 default-config-repeatability substitutes for the models that reject temperature outright in default mode. Only claude-haiku-4-5 (4/4) and gemini-3-1-pro (2/4 partial) show any repeatability signal at all; determinism is otherwise nearly universally absent on the live wire"
  - id: stop_sequence_honesty
    group: wire-behavior
    block: model_features
    applies_to: [1]
    value_type: string
    definition: "whether the model's OWN finish-reason field can distinguish a triggered stop-sequence truncation from a natural completion, independent of whether truncation itself is honored. Bare verdict cell: `honest` | `ambiguous` | `inconclusive`, or the not-applicable form for a model whose `stop` parameter the contract sweep rejects outright"
    note: "promoted 2026-09-03 (ADR-0050), the tracer key proving the wire-behavior group's cell grammar end-to-end. BHV-03: truncation is nearly universal (9/10 domain models), but only the 4 Anthropic models report a distinguishable stop_reason value — every other domain vendor shares one generic finish value for both the triggered and natural-completion case"
  - id: multi_candidate_delivery
    group: wire-behavior
    block: model_features
    applies_to: [1]
    value_type: string
    definition: "whether requesting more than one completion (n/candidateCount > 1) returns the number requested, is silently ignored (accepted but fewer delivered, with no error reporting the shortfall), or is rejected outright — a maker's own named rejection of the field is a measured verdict, never the not-applicable form. Bare verdict cell: `accepted-honored` | `accepted-ignored` | `rejected`, or the not-applicable form for a model with no request-side multi-candidate field. The single-candidate case (n:1) is uniformly honored everywhere and does not discriminate; only the multi-candidate request does"
    note: "promoted 2026-09-03 (ADR-0050). BHV-04: an 8-model domain splits four ways — 2 honored, 2 rejected outright, 1 (glm-5.3) silently returns 1 of 2 requested with no error, 2 (qwen3.8-max/qwen3.8-flash) reject under a documented thinking-mode conditionality, and gemini-3-1-pro's own candidateCount field is rejected at the contract sweep (a measured rejection, not a behavioral rate)"
  - id: logprobs_delivery
    group: wire-behavior
    block: model_features
    applies_to: [1]
    value_type: string
    definition: "whether requesting logprobs returns real per-token content, is accepted but delivers nothing (confirmed at a budget large enough to rule out truncation masking the result), or is rejected outright. Bare verdict cell: `accepted-honored` | `accepted-ignored` | `rejected`, or the not-applicable form for a model with no request-side logprobs field. Where a model has both an earlier contract classification and a later behavioral re-verification, the behavioral result governs and the cell states that it supersedes the earlier reading (rule 1a)"
    note: "promoted 2026-09-03 (ADR-0050). BHV-05: an 8-model domain — 3 reject outright, 2 accept and deliver nothing (confirmed at a non-masking budget), 3 deliver real content. qwen3.8-flash's cell carries a revised value: Phase 11's contract classification read accepted-ignored at a budget the reverify showed was confounded; the reverify found real per-token entries and the cell states the supersession explicitly"
  - id: service_tier_contract
    group: wire-behavior
    block: model_features
    applies_to: [1]
    value_type: string
    definition: "the compound service-tier fact: whether a service_tier/serviceTier request value is honored, silently translated, or ignored, AND where the response reports it — mirrored at the top level, nested under a usage envelope and never mirrored there, or absent from the response entirely. Bare verdict cell: `accepted-ignored` | `silently-translated` | `response-asymmetric` | `response-absent`. Every cell cites both tested contracts — the presence row and, where the model is inside its firing scope, the value-enum row — plus the behavioral tier-audit cells where they exist (D-09); a model outside the enum row's scope states that the enum was not tested there rather than implying a result"
    note: "promoted 2026-09-03 (ADR-0050). D-09/BHV-06: presence fires against all 12 models (gemini-3-1-pro is tested under its own top-level serviceTier field rather than the shared compat service_tier row, which is skipped for it); the value-enum row fires against 7 openai_compat-family models. The response side shows three genuinely distinct states — Anthropic and Gemini both nest the tier under a usage envelope and never mirror it to the top level (Anthropic's own trap probe rejects the response vocabulary word `standard` when sent as a request value); kimi-k3/deepseek-v4/glm-5.3/qwen3.8-flash carry no response-side tier field at all; the remaining models (gpt-5-6-sol, grok-4-5, qwen3.8-max) show a flat, present response with no asymmetry"
  # --- category-4 block (`workflow_features:`) ---
  - id: intent_pipeline
    group: spine
