# --- transcription fields (added 2026-08-26) — the OTHER half of the placement test ---
# Facts with an external ground truth, transcribed and dated: top-level frontmatter
# fields, never duplicated as registry keys. Enumerated here so the whole assessment
# surface is visible in one place (rendered in comparisons/feature-registry.md); an id
# appearing in both this list and features[] is a generator ERROR — the placement test,
# enforced. Verification vocabulary: dated-docs (verified against the report's url on
# its checked date — for vendor-defined facts like a price or a context window the docs
# ARE the ground truth, the one place rule 1a's source-beats-testimony ordering
# inverts) · mechanical (script-collected — repo-facts.sh / GitHub API — never
# hand-typed) · source-or-docs (read in the pinned clone or official docs, the same
# discipline as feature cells). Honesty/meta columns (depth, checked, read_at) and
# tool-taxonomy classification fields (category, type) are deliberately absent: rule 2
# and tool-taxonomy.md govern those, and they are not facts about the subject.
transcription_fields:
  - id: model_id
    group: identity
    applies_to: [1]
    value_type: string
    definition: "exact API model id / HF repo id — the purchasable name, which routes and aggregators may not preserve"
    verification: dated-docs
    rendered_in: []
  - id: maker
    group: identity
    applies_to: [1, 2, 3, 4, 5, 6]
    value_type: string
    definition: "who built or trained it — a company, a research lab, or a named individual. Renamed from `vendor` 2026-08-26 (ADR-0042): four values are private people and two more disclaim commerce, so `vendor` asserted a commercial relationship the field does not carry. Exact-string identity matters — spelling drift makes one maker read as two when span is reasoned about (tool-taxonomy.md § Maker span)"
    verification: source-or-docs
    rendered_in: []   # no generated matrix renders it since vendors.md was removed (ADR-0041); it carries hand-kept tables and § Maker span
  - id: access
    group: identity
    applies_to: [1, 2, 3, 4, 5, 6]
    value_type: closed-enum
    definition: >-
      which artifact of the SUBJECT the public can obtain and inspect — open-source
      (the source is public, whatever the terms) | open-weights (a model's trained
      weights are published; its training source is not) | closed-source (neither).
      ACCESS, NOT TERMS: pilot-shell reads open-source under a non-OSI EULA, and the
      `license` cell beside it carries the terms — the two are a PAIR, and the
      OSI-open vs source-available distinction is read off that pair, never asserted
      here. THE SUBJECT is the thing the report is about as shipped, never an
      accessory: modal is closed-source though its client SDK is Apache-2.0;
      claude-code is closed-source though its repo is public (issues + distribution,
      not source). Dated like every transcribed fact — daytona is closed-source TODAY
      and AGPL-3.0 at its freeze pin.
    verification: source-or-docs
    rendered_in: [tools.md, features.md]
    note: >-
      renamed from `open_source` 2026-08-26 (ADR-0044), and NOT a pure key rename: the
      boolean carried four incompatible meanings, each rescued by a YAML comment
      safe_load drops before any matrix renders — non-OSI but public (pilot-shell),
      product closed / client open (modal), open at the pin but closed today (daytona),
      no source at all (claude-code). pilot-shell FLIPS (`false` → `open-source`): the
      old field meant OSI-ness, this one means access. CATEGORY-1 WRINKLE, recorded
      rather than hidden: for all eleven models read so far the value is derivable from
      `release_mode` (api-only ⇔ closed-source; open-weights/both ⇔ open-weights), so it
      added no information there. THAT REDUNDANCY WAS RESOLVED THE SAME DAY, in the other
      direction: `release_mode` is retired (ADR-0046) — it was isomorphic to this field
      once corrected, rendered in no matrix, and wrong on two of eleven rows because
      nothing rendered it. What survives is this field, which expresses a state
      `release_mode` could not — a model whose TRAINING SOURCE is public reads
      open-source. Zero instances so far; zeros are honest.
  - id: license
    group: identity
    applies_to: [1, 2, 3, 4, 5, 6]
    value_type: string
    definition: "SPDX id or 'proprietary'; for category 1 the WEIGHTS license — unverifiable until weights are published, and recorded as such rather than assumed from a predecessor"
    verification: source-or-docs
    rendered_in: [tools.md, features.md]
  - id: stars
    group: provenance
    applies_to: [2, 3, 4, 5, 6]
    value_type: number
    definition: "GitHub stars via the API, carrying their own stars_at date (stars drift daily); describes the CURRENT repo only — a fork or org move strands the predecessor's stars"
    verification: mechanical
    rendered_in: [tools.md]
  - id: first_commit
    group: provenance
    applies_to: [2, 3, 4, 5, 6]
    value_type: date
    definition: "the public repo's first commit date — the public history's start, which postdates the product where a tool open-sourced later"
    verification: mechanical
    rendered_in: [tools.md]
  - id: version
    group: provenance
    applies_to: [2, 3, 4, 5, 6]
    value_type: string
    definition: "git describe --tags --always of the clone at read time. Corrected 2026-08-26 (ADR-0044): the old 'omitted for closed source' was wrong on both halves — a closed PRODUCT can have a pinned open client (modal), and a subject with no clone at all can still report a version, which is then self-reported rather than machine-checked (claude-code's `claude --version`) and must say so in the field's comment. The cell only became visible for closed subjects when the Version-read column stopped substituting an openness literal"
    verification: mechanical
    rendered_in: [tools.md]
  - id: commit
    group: provenance
    applies_to: [2, 3, 4, 5, 6]
    value_type: string
    definition: "the ONE machine-checked pin per report — build-tool-index --check verifies it still resolves in upstream/<name>; secondary pins are prose-recorded (see the tool template)"
    verification: mechanical
    rendered_in: []
  - id: stack
    group: shape
    applies_to: [2, 3, 4, 5, 6]
    value_type: list
    definition: "[Language, Runtime/Framework] of the subject"
    verification: source-or-docs
    rendered_in: [tools.md]
  - id: surfaces
    group: shape
    applies_to: [2]
    value_type: list
    definition: >-
      where you interact — terminal | ide | desktop | web | messaging (multi-valued).
      `messaging` added 2026-08-27 (ADR-0047) on the second verified instance: it names a
      CLASS of platforms rather than one, and the report's cell comment says which
      (hermes-agent ~20 via its gateway; qwen-code 11 channel packages — feishu, dingtalk,
      telegram, qqbot, wecom, weixin, github, gitlab, dws). Before it, both reports recorded
      the platforms in prose as explicitly outside the vocabulary
    verification: source-or-docs
    rendered_in: [tools.md]
  - id: residency
    group: shape
    applies_to: [2]
    value_type: closed-enum
    definition: >-
      does the agent outlive the conversation — session | resident. `resident` means a
      persistent process that survives any one conversation and can act unprompted: a daemon,
      scheduled work, or inbound messages arriving with no session open. DISTINCT FROM
      `execution`, which says WHERE the work runs (local vs someone else's machine); the two
      are independent, which is exactly why this is its own field. Both verified instances
      prove the independence: hermes-agent is `both` + resident, qwen-code is `local` +
      resident, and a third `execution` value would have forced each to drop a true fact.
      Verified-only like every transcribed fact — omitted means not checked, and most reports
      predate the field
    verification: source-or-docs
    rendered_in: [tools.md]
    note: >-
      added 2026-08-27 (ADR-0047), firing a trigger the tool taxonomy wrote for itself at the
      hermes-agent deep-dive (2026-07-30): "not promoted to a third value on one instance —
      recorded here so the second instance triggers the revision". qwen-code supplied it from
      an independent lineage, which is what makes it a shape rather than one product's quirk
  - id: execution
    group: shape
    applies_to: [2]
    value_type: closed-enum
    definition: "how it runs — local | async-remote | both"
    verification: source-or-docs
    rendered_in: [tools.md]
  - id: environments
    group: environment-binding
    applies_to: [2]
    value_type: list
    definition: "category-3 bindings (the bleed): which environments the tool can run its agent in — list only what is verified"
    verification: source-or-docs
    rendered_in: [environments.md]
  - id: environment_relation
    group: environment-binding
    applies_to: [2]
    value_type: closed-enum
    definition: "HOW the tool relates to the environment — bundle | bind | internalize | inhabit; left unset when none of the four fits, and that null case is data"
    verification: source-or-docs
    rendered_in: [environments.md]
  - id: harness_targets
    group: shape
    applies_to: [4, 5, 6]
    value_type: list
    definition: "which harnesses the tool officially installs into — verified-only; a list, or a short string for large sets"
    verification: source-or-docs
    rendered_in: [tools.md]
  - id: release_date
    group: identity
    applies_to: [1]
    value_type: date
    renders_note: true
    definition: >-
      FIRST AVAILABILITY on a first-party surface — YYYY-MM or YYYY-MM-DD, null when the
      vendor publishes none. The cell is a mapping (`date` + `stage` + `note`) but the FACT
      is a date, and value_type types the fact (ADR-0039). `stage` is the vendor's OWN word
      at that date (GA · Preview · beta) because stages don't align across vendors, plus two
      controlled markers: `not-stated` where the vendor uses no stage vocabulary at all
      (four of eleven), and `ambiguous` where the vendor's own surfaces disagree (GPT-5.6
      Sol: a launch post says 'preview', the same day's API changelog says 'Released').
      `note` is REQUIRED and carries what the pair cannot — a later stage transition
      (DeepSeek V4's preview→GA arc), why a date is month-level, why a date is null, and the
      surface checked with its date. Third-party ship-date inference is never the date.
      Renamed from `released` 2026-08-26 (ADR-0046), which itself replaced `ga_date`
      2026-08-17: the free-text field held the right fact under a name that promised less,
      and the structure is what lets the name promise a date honestly.
    verification: dated-docs
    rendered_in: [models.md]
  - id: context_window
    group: capacity
    applies_to: [1]
    value_type: number
    definition: "advertised input tokens; usable-vs-advertised is a category-1 axis, measured in report evidence cells, not here"
    verification: dated-docs
    rendered_in: [models.md, features.md]
  - id: max_output
    group: capacity
    applies_to: [1]
    value_type: number
    definition: "maximum output tokens, with vendor caveats carried in the value (defaults vs settable ceilings, visible-output-only counts)"
    verification: dated-docs
    rendered_in: [models.md]
  - id: pricing
    group: cost
    applies_to: [1]
    value_type: structured
    renders_note: true
    definition: >-
      a mapping, not a string (ADR-0033): input + output (numbers, USD per MTok) ·
      currency · regime (flat | context-tiered | time-of-day | variant-priced |
      route-dependent) · note. THE BASE-RATE RULE, which is what makes the numbers
      comparable: input/output are the list rate for a small, standard, non-batch,
      uncached request on the vendor's first-party USD surface, for the model THIS
      report is about — so Sol's $5/$30 and not its Terra/Luna siblings, DeepSeek's
      peak rate, Qwen's smallest tier. regime names why the base is not the whole
      story and carries ONE value even where two apply (gpt-5-6-sol is both
      context-tiered and variant-priced): the second regime lives in note rather than
      making regime list-valued, because a matrix column sorts on one thing. note
      carries everything the numbers cannot — tier boundaries and their semantics,
      off-peak windows, sibling variants, non-USD lists that are not conversions,
      retired promos ledgers still depend on — dated, and is required unless regime
      is flat.
    verification: dated-docs
    rendered_in: [models.md]
  - id: knowledge_cutoff
    group: capacity
    applies_to: [1]
    value_type: date
    renders_note: true
    definition: >-
      THE LIMIT DATE ON TRAINING DATA — the outer bound of what the model was trained on,
      YYYY-MM or YYYY-MM-DD, null when the vendor publishes none. The cell is written as a
      mapping (`date` + `basis` + `note`) but the FACT is a date, and value_type types the
      fact (ADR-0039). The extra keys exist for one reason: five of eleven models publish
      no cutoff at all, and a generated matrix cell reading "—" with no explanation is the
      not-checked-vs-checked-absent ambiguity this repo works hardest to avoid — a YAML
      comment cannot carry it, because safe_load drops comments before any matrix is
      rendered. basis says what kind of claim the date is: vendor-stated | inherited (the
      vendor delegates the underlying fact elsewhere, as Gemini 3.1 Pro delegates its
      training dataset to the Gemini 3 Pro card) | not-stated | retracted — and date MUST
      be null when basis is not-stated or retracted. note is required and carries the
      surface checked and when, the search scope behind a not-stated, the delegation behind
      an inherited, the history behind a retracted, and any finer vendor figure (Anthropic
      publishes a `reliableKnowledgeCutoff` five months earlier than the training limit for
      Haiku 4.5). Third-party ship-date inference is never a cutoff.
    verification: dated-docs
    rendered_in: [models.md]
