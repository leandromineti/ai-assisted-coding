<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 18 562 332" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2e3440" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="34" y="18" width="562" height="332" fill="#ffffff"/>

  <!-- Developer, centered over the harness -->
  <circle cx="320" cy="38" r="9" fill="#ffffff" stroke="#4c566a" stroke-width="1.8"/>
  <path d="M 305 72 C 305 52, 335 52, 335 72" fill="none" stroke="#4c566a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="320" y="89" text-anchor="middle" font-size="13" fill="#4c566a">You</text>

  <line x1="320" y1="96" x2="320" y2="148" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Harness with the Model as a mounted slab -->
  <rect x="150" y="150" width="340" height="114" rx="12" fill="#eceff4" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="320" y="178" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Harness</text>

  <rect x="166" y="190" width="308" height="62" rx="8" fill="#ffffff" stroke="#5e81ac" stroke-width="1.8" filter="url(#lift)"/>
  <text x="320" y="226" text-anchor="middle" font-size="16" font-weight="600" fill="#5e81ac">Model</text>

  <!-- the agent loop -->
  <path d="M 490 207 C 548 226, 548 288, 494 307" fill="none" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="550" y="260" font-size="10.5" fill="#7b8494">actions</text>
  <path d="M 150 307 C 92 288, 92 226, 146 207" fill="none" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="260" text-anchor="end" font-size="10.5" fill="#7b8494">feedback</text>

  <!-- Execution environment -->
  <rect x="150" y="276" width="340" height="62" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="320" y="313" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Execution environment</text>
</svg>
