<svg xmlns="http://www.w3.org/2000/svg" viewBox="110 10 450 460" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2e3440" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="110" y="10" width="450" height="460" fill="#ffffff"/>

  <!-- Developer -->
  <circle cx="220" cy="50" r="9" fill="#ffffff" stroke="#4c566a" stroke-width="1.8"/>
  <path d="M 205 84 C 205 64, 235 64, 235 84" fill="none" stroke="#4c566a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="220" y="101" text-anchor="middle" font-size="13" fill="#4c566a">You</text>

  <line x1="220" y1="110" x2="220" y2="186" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Harness container (surface tone) -->
  <rect x="150" y="188" width="340" height="150" rx="12" fill="#eceff4" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="166" y="216" font-size="17" font-weight="600" fill="#2e3440">Harness</text>

  <!-- Model: resting ON the harness — lifted by a drop shadow, not part of it -->
  <rect x="300" y="200" width="160" height="86" rx="8" fill="#ffffff" stroke="#5e81ac" stroke-width="1.8" filter="url(#lift)"/>
  <text x="314" y="224" font-size="16" font-weight="600" fill="#5e81ac">Model</text>

  <line x1="320" y1="340" x2="320" y2="382" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Execution environment -->
  <rect x="150" y="384" width="340" height="80" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="166" y="412" font-size="16" font-weight="600" fill="#2e3440">Execution environment</text>
</svg>
