<svg xmlns="http://www.w3.org/2000/svg" viewBox="36 20 560 436" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2e3440" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="36" y="20" width="560" height="436" fill="#ffffff"/>

  <!-- Developer -->
  <circle cx="220" cy="38" r="9" fill="#ffffff" stroke="#4c566a" stroke-width="1.8"/>
  <path d="M 205 72 C 205 52, 235 52, 235 72" fill="none" stroke="#4c566a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="220" y="89" text-anchor="middle" font-size="13" fill="#4c566a">You</text>

  <line x1="220" y1="96" x2="220" y2="110" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Workflow framework: connection to the harness implied by proximity -->
  <rect x="150" y="112" width="340" height="62" rx="8" fill="#ffffff" stroke="#7b8494" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="172" y="148" font-size="14" font-weight="600" fill="#4c566a">Workflow framework</text>

  <!-- Harness container -->
  <rect x="150" y="186" width="340" height="150" rx="12" fill="#eceff4" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="172" y="322" font-size="17" font-weight="600" fill="#2e3440">Harness</text>

  <!-- Portable artifacts: mounted component -->
  <rect x="170" y="198" width="118" height="86" rx="8" fill="#ffffff" stroke="#7b8494" stroke-width="1.6" filter="url(#lift)"/>
  <text x="182" y="224" font-size="13" font-weight="600" fill="#4c566a">Extensions</text>
  <text x="182" y="248" font-size="10" fill="#7b8494">MCP · skills</text>
  <text x="182" y="261" font-size="10" fill="#7b8494">rules · hooks</text>

  <!-- Model: mounted component -->
  <rect x="300" y="198" width="160" height="86" rx="8" fill="#ffffff" stroke="#5e81ac" stroke-width="1.8" filter="url(#lift)"/>
  <text x="314" y="222" font-size="16" font-weight="600" fill="#5e81ac">Model</text>

  <!-- the agent loop, cycling around the pair -->
  <path d="M 490 296 C 545 310, 545 375, 494 390" fill="none" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="542" y="347" font-size="10.5" fill="#7b8494">actions</text>
  <path d="M 150 390 C 95 376, 95 311, 146 296" fill="none" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="98" y="347" text-anchor="end" font-size="10.5" fill="#7b8494">feedback</text>

  <!-- Execution environment -->
  <rect x="150" y="364" width="340" height="80" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="166" y="392" font-size="16" font-weight="600" fill="#2e3440">Execution environment</text>
</svg>
