<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 560" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b48ead"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="560" fill="#ffffff"/>

  <!-- ===== Left: the human + workflow frameworks boundary ===== -->
  <circle cx="130" cy="70" r="26" fill="#eceff4" stroke="#4c566a" stroke-width="1.5"/>
  <text x="130" y="76" text-anchor="middle" font-size="15" fill="#2e3440" font-weight="600">You</text>

  <line x1="130" y1="96" x2="130" y2="150" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="35" y="152" width="190" height="150" rx="8" fill="#f4ecf7" stroke="#b48ead" stroke-width="1.5"/>
  <text x="130" y="178" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">Workflow</text>
  <text x="130" y="196" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">frameworks</text>
  <text x="130" y="220" text-anchor="middle" font-size="12" fill="#4c566a">spec-kit · GSD</text>
  <text x="130" y="244" text-anchor="middle" font-size="12" fill="#4c566a">intent ↓ specs, tasks</text>
  <text x="130" y="262" text-anchor="middle" font-size="12" fill="#4c566a">evidence ↑ research,</text>
  <text x="130" y="278" text-anchor="middle" font-size="12" fill="#4c566a">verified results</text>

  <line x1="225" y1="227" x2="298" y2="227" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ===== Center: the core triad ===== -->
  <rect x="300" y="40" width="330" height="100" rx="8" fill="#e8f0f7" stroke="#5e81ac" stroke-width="1.5"/>
  <text x="465" y="68" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Models</text>
  <text x="465" y="92" text-anchor="middle" font-size="12" fill="#4c566a">the weights + the API surface around them</text>
  <text x="465" y="110" text-anchor="middle" font-size="12" fill="#4c566a">pricing · caching · effort · lifecycle — drifts monthly</text>

  <line x1="465" y1="140" x2="465" y2="175" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>
  <text x="478" y="162" font-size="11" fill="#4c566a">API calls</text>

  <rect x="300" y="177" width="330" height="120" rx="8" fill="#e9f2e4" stroke="#a3be8c" stroke-width="2"/>
  <text x="465" y="205" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Harnesses</text>
  <text x="465" y="229" text-anchor="middle" font-size="12" fill="#4c566a">the agent loop: context assembly, tools,</text>
  <text x="465" y="246" text-anchor="middle" font-size="12" fill="#4c566a">execution, stopping — a measured capability layer</text>
  <text x="465" y="270" text-anchor="middle" font-size="12" fill="#4c566a">Claude Code · Codex CLI · OpenCode · Cursor</text>

  <line x1="465" y1="297" x2="465" y2="332" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="478" y="320" font-size="11" fill="#4c566a">actions land here</text>

  <rect x="300" y="334" width="330" height="100" rx="8" fill="#fdf3e7" stroke="#d08770" stroke-width="1.5"/>
  <text x="465" y="362" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Execution environments</text>
  <text x="465" y="386" text-anchor="middle" font-size="12" fill="#4c566a">host · git worktree · container · cloud microVM</text>
  <text x="465" y="404" text-anchor="middle" font-size="12" fill="#4c566a">a rung with its own hidden facts, not an attribute</text>

  <!-- absorption annotation -->
  <line x1="648" y1="237" x2="648" y2="120" stroke="#a3be8c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <line x1="648" y1="237" x2="648" y2="360" stroke="#a3be8c" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow)"/>
  <text x="660" y="205" font-size="11" fill="#4c566a">absorption:</text>
  <text x="660" y="220" font-size="11" fill="#4c566a">harnesses grow native</text>
  <text x="660" y="235" font-size="11" fill="#4c566a">gates, memory,</text>
  <text x="660" y="250" font-size="11" fill="#4c566a">orchestration</text>

  <!-- ===== Bottom-left: portable artifacts bucket ===== -->
  <rect x="35" y="380" width="190" height="140" rx="8" fill="#fbf6e3" stroke="#ebcb8b" stroke-width="1.5"/>
  <text x="130" y="406" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">Portable artifacts</text>
  <text x="130" y="430" text-anchor="middle" font-size="12" fill="#4c566a">MCP (standardized)</text>
  <text x="130" y="448" text-anchor="middle" font-size="12" fill="#4c566a">skills · rules files</text>
  <text x="130" y="466" text-anchor="middle" font-size="12" fill="#4c566a">(filename conventions)</text>
  <text x="130" y="484" text-anchor="middle" font-size="12" fill="#4c566a">hooks · subagents</text>
  <text x="130" y="502" text-anchor="middle" font-size="12" fill="#4c566a">(harness-specific)</text>

  <path d="M 225 430 C 270 420, 275 280, 298 260" fill="none" stroke="#b48ead" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <text x="238" y="360" font-size="11" fill="#4c566a" transform="rotate(-68 238 360)">plug into the edges</text>
</svg>
