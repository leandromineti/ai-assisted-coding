<svg xmlns="http://www.w3.org/2000/svg" viewBox="34 18 562 522" font-family='system-ui, -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif'>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <filter id="lift" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#2e3440" flood-opacity="0.22"/>
    </filter>
  </defs>

  <rect x="34" y="18" width="562" height="522" fill="#ffffff"/>

  <!-- Developer, centered -->
  <circle cx="320" cy="38" r="9" fill="#ffffff" stroke="#4c566a" stroke-width="1.8"/>
  <path d="M 305 72 C 305 52, 335 52, 335 72" fill="none" stroke="#4c566a" stroke-width="1.8" stroke-linecap="round"/>
  <text x="320" y="89" text-anchor="middle" font-size="13" fill="#4c566a">You</text>

  <line x1="320" y1="96" x2="320" y2="148" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Workflow framework: the added layer; connection to the harness by proximity -->
  <rect x="150" y="150" width="340" height="56" rx="8" fill="#ffffff" stroke="#7b8494" stroke-width="1.4" stroke-dasharray="5 4"/>
  <text x="320" y="184" text-anchor="middle" font-size="14" font-weight="600" fill="#4c566a">Workflow framework</text>

  <!-- Harness with two mounted slabs -->
  <rect x="150" y="218" width="340" height="188" rx="12" fill="#eceff4" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="166" y="246" font-size="16" font-weight="600" fill="#2e3440">Harness</text>

  <rect x="166" y="258" width="308" height="60" rx="8" fill="#ffffff" stroke="#5e81ac" stroke-width="1.8" filter="url(#lift)"/>
  <text x="320" y="294" text-anchor="middle" font-size="16" font-weight="600" fill="#5e81ac">Model</text>

  <rect x="166" y="330" width="308" height="64" rx="8" fill="#ffffff" stroke="#7b8494" stroke-width="1.6" filter="url(#lift)"/>
  <text x="320" y="356" text-anchor="middle" font-size="14" font-weight="600" fill="#4c566a">Extensions</text>
  <text x="320" y="376" text-anchor="middle" font-size="10.5" fill="#7b8494">MCP · skills · rules · hooks</text>

  <!-- the agent loop -->
  <path d="M 490 270 C 548 292, 548 446, 494 462" fill="none" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="550" y="366" font-size="10.5" fill="#7b8494">actions</text>
  <path d="M 150 462 C 92 446, 92 292, 146 270" fill="none" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="90" y="366" text-anchor="end" font-size="10.5" fill="#7b8494">feedback</text>

  <!-- Execution environment -->
  <rect x="150" y="446" width="340" height="80" rx="10" fill="#ffffff" stroke="#d8dee9" stroke-width="1.5"/>
  <text x="166" y="474" font-size="16" font-weight="600" fill="#2e3440">Execution environment</text>
</svg>
