<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 600" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b48ead"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="600" fill="#ffffff"/>

  <!-- ===== Models layer (top), with ghost alternatives suggesting swappability ===== -->
  <rect x="392" y="34" width="236" height="96" rx="8" fill="none" stroke="#5e81ac" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
  <rect x="384" y="27" width="236" height="96" rx="8" fill="none" stroke="#5e81ac" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <rect x="376" y="20" width="236" height="96" rx="8" fill="#e8f0f7" stroke="#5e81ac" stroke-width="1.5"/>
  <text x="494" y="47" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Models</text>
  <text x="494" y="70" text-anchor="middle" font-size="12" fill="#4c566a">the weights + the API surface around them</text>
  <text x="494" y="88" text-anchor="middle" font-size="12" fill="#4c566a">pricing · caching · effort · lifecycle</text>
  <text x="494" y="106" text-anchor="middle" font-size="12" fill="#4c566a">— drifts monthly</text>

  <!-- socket: the model-harness edge, drawn as a plug -->
  <line x1="470" y1="116" x2="470" y2="176" stroke="#5e81ac" stroke-width="2.5"/>
  <line x1="518" y1="116" x2="518" y2="176" stroke="#5e81ac" stroke-width="2.5"/>
  <rect x="450" y="168" width="88" height="14" rx="3" fill="#d8e2ec" stroke="#5e81ac" stroke-width="1.5"/>
  <text x="556" y="152" font-size="11" fill="#4c566a">the socket: swappable —</text>
  <text x="556" y="167" font-size="11" fill="#4c566a">same harness, different weights.</text>
  <text x="556" y="182" font-size="11" fill="#4c566a">Per-model prompts and benchmark</text>
  <text x="556" y="197" font-size="11" fill="#4c566a">confounds hide on this edge</text>

  <!-- ===== Harness (center) ===== -->
  <rect x="330" y="182" width="330" height="180" rx="10" fill="#e9f2e4" stroke="#a3be8c" stroke-width="2.5"/>
  <text x="495" y="216" text-anchor="middle" font-size="17" font-weight="600" fill="#2e3440">Harness</text>
  <text x="495" y="242" text-anchor="middle" font-size="12" fill="#4c566a">the agent loop: context assembly, tools,</text>
  <text x="495" y="260" text-anchor="middle" font-size="12" fill="#4c566a">execution, deciding when to stop</text>
  <text x="495" y="284" text-anchor="middle" font-size="12" fill="#4c566a">a measured capability layer, not plumbing</text>
  <text x="495" y="308" text-anchor="middle" font-size="12" fill="#4c566a">Claude Code · Codex CLI · OpenCode · Cursor</text>
  <text x="495" y="340" text-anchor="middle" font-size="11" font-style="italic" fill="#4c566a">absorbing gates, memory, orchestration from its neighbors ⤒⤓</text>

  <!-- ===== Environment (below) ===== -->
  <line x1="495" y1="362" x2="495" y2="420" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="508" y="398" font-size="11" fill="#4c566a">actions land here</text>

  <rect x="330" y="422" width="330" height="96" rx="8" fill="#fdf3e7" stroke="#d08770" stroke-width="1.5"/>
  <text x="495" y="450" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">Execution environment</text>
  <text x="495" y="474" text-anchor="middle" font-size="12" fill="#4c566a">host · git worktree · container · cloud microVM</text>
  <text x="495" y="492" text-anchor="middle" font-size="12" fill="#4c566a">a rung with its own hidden facts, not an attribute</text>

  <!-- ===== Left: developer → workflow frameworks → harness ===== -->
  <circle cx="70" cy="272" r="28" fill="#eceff4" stroke="#4c566a" stroke-width="1.5"/>
  <text x="70" y="278" text-anchor="middle" font-size="14" fill="#2e3440" font-weight="600">You</text>

  <line x1="100" y1="272" x2="138" y2="272" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <rect x="140" y="200" width="152" height="144" rx="8" fill="#f4ecf7" stroke="#b48ead" stroke-width="1.5"/>
  <text x="216" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">Workflow</text>
  <text x="216" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">frameworks</text>
  <text x="216" y="270" text-anchor="middle" font-size="12" fill="#4c566a">spec-kit · GSD</text>
  <text x="216" y="294" text-anchor="middle" font-size="12" fill="#4c566a">intent ↓ specs, tasks</text>
  <text x="216" y="312" text-anchor="middle" font-size="12" fill="#4c566a">evidence ↑ research,</text>
  <text x="216" y="330" text-anchor="middle" font-size="12" fill="#4c566a">verified results</text>

  <line x1="292" y1="272" x2="328" y2="272" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- ===== Right: portable artifacts ===== -->
  <rect x="700" y="200" width="152" height="144" rx="8" fill="#fbf6e3" stroke="#ebcb8b" stroke-width="1.5"/>
  <text x="776" y="228" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">Portable</text>
  <text x="776" y="246" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">artifacts</text>
  <text x="776" y="270" text-anchor="middle" font-size="12" fill="#4c566a">MCP (standardized)</text>
  <text x="776" y="288" text-anchor="middle" font-size="12" fill="#4c566a">skills · rules files</text>
  <text x="776" y="306" text-anchor="middle" font-size="12" fill="#4c566a">(filename conventions)</text>
  <text x="776" y="324" text-anchor="middle" font-size="12" fill="#4c566a">hooks (harness-specific)</text>

  <line x1="698" y1="272" x2="662" y2="272" stroke="#b48ead" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
  <text x="680" y="260" text-anchor="end" font-size="11" fill="#4c566a">plug in</text>
</svg>
