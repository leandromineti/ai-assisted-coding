<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 760" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
    <marker id="arrowdash" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#b48ead"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="640" height="760" fill="#ffffff"/>

  <!-- abstraction axis hint (left) -->
  <line x1="46" y1="90" x2="46" y2="680" stroke="#d8dee9" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="46" y="72" text-anchor="middle" font-size="12" fill="#9aa5b5">abstract</text>
  <text x="46" y="706" text-anchor="middle" font-size="12" fill="#9aa5b5">concrete</text>

  <!-- You -->
  <circle cx="300" cy="80" r="34" fill="#eceff4" stroke="#4c566a" stroke-width="1.5"/>
  <text x="300" y="86" text-anchor="middle" font-size="16" font-weight="600" fill="#2e3440">You</text>

  <line x1="300" y1="114" x2="300" y2="158" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Workflow frameworks -->
  <rect x="170" y="160" width="260" height="66" rx="10" fill="#f4ecf7" stroke="#b48ead" stroke-width="1.5"/>
  <text x="300" y="200" text-anchor="middle" font-size="17" font-weight="600" fill="#2e3440">Workflow frameworks</text>

  <line x1="300" y1="226" x2="300" y2="270" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- Harness with model straddling the top edge -->
  <rect x="130" y="290" width="340" height="230" rx="12" fill="#e9f2e4" stroke="#a3be8c" stroke-width="2.5"/>

  <rect x="222" y="284" width="180" height="86" rx="8" fill="none" stroke="#5e81ac" stroke-width="1" stroke-dasharray="3 4" opacity="0.45"/>
  <rect x="214" y="277" width="180" height="86" rx="8" fill="none" stroke="#5e81ac" stroke-width="1" stroke-dasharray="3 4" opacity="0.7"/>
  <rect x="206" y="270" width="180" height="86" rx="8" fill="#e8f0f7" stroke="#5e81ac" stroke-width="1.8"/>
  <text x="296" y="320" text-anchor="middle" font-size="17" font-weight="600" fill="#2e3440">Model</text>

  <text x="300" y="450" text-anchor="middle" font-size="18" font-weight="600" fill="#2e3440">Harness</text>

  <line x1="300" y1="520" x2="300" y2="564" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Execution environment: the ground -->
  <rect x="90" y="566" width="420" height="80" rx="10" fill="#fdf3e7" stroke="#d08770" stroke-width="1.5"/>
  <text x="300" y="613" text-anchor="middle" font-size="17" font-weight="600" fill="#2e3440">Execution environment</text>

  <!-- Portable artifacts (side) -->
  <rect x="500" y="352" width="118" height="110" rx="10" fill="#fbf6e3" stroke="#ebcb8b" stroke-width="1.5"/>
  <text x="559" y="384" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">Portable</text>
  <text x="559" y="403" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">artifacts</text>
  <text x="559" y="428" text-anchor="middle" font-size="11" fill="#4c566a">MCP · skills</text>
  <text x="559" y="444" text-anchor="middle" font-size="11" fill="#4c566a">rules · hooks</text>

  <line x1="498" y1="407" x2="474" y2="407" stroke="#b48ead" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowdash)"/>
</svg>
