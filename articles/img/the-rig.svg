<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 540" font-family="system-ui, -apple-system, sans-serif">
  <defs>
    <!-- orient="auto", never "auto-start-reverse": resvg (which rasterises the OG
         cards) does not implement that SVG 2 value and silently falls back to
         orient="0", pointing every head right instead of along its path. -->
    <marker id="arrowg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c8c58"/>
    </marker>
    <marker id="arrowr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#bf616a"/>
    </marker>
    <marker id="arrowk" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#4c566a"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="880" height="540" fill="#ffffff"/>

  <!-- internal network -->
  <rect x="25" y="30" width="560" height="300" rx="10" fill="#f7f9fb" stroke="#4c566a" stroke-width="1.5" stroke-dasharray="7 5"/>
  <text x="45" y="58" font-size="13" font-weight="600" fill="#4c566a">internal Docker network — no direct route out</text>

  <!-- arm container -->
  <rect x="55" y="85" width="240" height="215" rx="8" fill="#e9f2e4" stroke="#a3be8c" stroke-width="2"/>
  <text x="175" y="112" text-anchor="middle" font-size="15" font-weight="600" fill="#2e3440">arm container</text>
  <text x="175" y="136" text-anchor="middle" font-size="12" fill="#4c566a">pinned image (by digest)</text>
  <text x="175" y="154" text-anchor="middle" font-size="12" fill="#4c566a">pinned harness CLI · pinned model</text>
  <text x="175" y="172" text-anchor="middle" font-size="12" fill="#4c566a">fixed TZ + locale</text>
  <rect x="80" y="190" width="190" height="88" rx="6" fill="#ffffff" stroke="#a3be8c" stroke-width="1.2"/>
  <text x="175" y="212" text-anchor="middle" font-size="12" font-weight="600" fill="#2e3440">agent works in /app</text>
  <text x="175" y="232" text-anchor="middle" font-size="11" fill="#4c566a">same one-paragraph task,</text>
  <text x="175" y="248" text-anchor="middle" font-size="11" fill="#4c566a">every arm · autonomous ·</text>
  <text x="175" y="264" text-anchor="middle" font-size="11" fill="#4c566a">final state is the artifact</text>

  <!-- proxy -->
  <rect x="380" y="110" width="165" height="120" rx="8" fill="#fbf6e3" stroke="#ebcb8b" stroke-width="1.5"/>
  <text x="462" y="138" text-anchor="middle" font-size="14" font-weight="600" fill="#2e3440">allowlist proxy</text>
  <text x="462" y="160" text-anchor="middle" font-size="12" fill="#4c566a">the only way out</text>
  <text x="462" y="182" text-anchor="middle" font-size="12" fill="#4c566a">every decision logged —</text>
  <text x="462" y="200" text-anchor="middle" font-size="12" fill="#4c566a">the log is the probe record</text>

  <line x1="295" y1="170" x2="378" y2="170" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrowk)"/>
  <text x="336" y="160" text-anchor="middle" font-size="11" fill="#4c566a">all egress</text>

  <!-- allowed destinations -->
  <rect x="650" y="60" width="195" height="52" rx="8" fill="#e8f0f7" stroke="#5e81ac" stroke-width="1.5"/>
  <text x="747" y="83" text-anchor="middle" font-size="13" font-weight="600" fill="#2e3440">model API</text>
  <text x="747" y="101" text-anchor="middle" font-size="11" fill="#4c566a">allowed</text>

  <rect x="650" y="130" width="195" height="52" rx="8" fill="#e8f0f7" stroke="#5e81ac" stroke-width="1.5"/>
  <text x="747" y="153" text-anchor="middle" font-size="13" font-weight="600" fill="#2e3440">package registry (PyPI)</text>
  <text x="747" y="171" text-anchor="middle" font-size="11" fill="#4c566a">allowed — the task needs installs</text>

  <rect x="650" y="200" width="195" height="52" rx="8" fill="#fdeeee" stroke="#bf616a" stroke-width="1.5"/>
  <text x="747" y="223" text-anchor="middle" font-size="13" font-weight="600" fill="#2e3440">everything else</text>
  <text x="747" y="241" text-anchor="middle" font-size="11" fill="#4c566a">DENY, logged — no web research</text>

  <line x1="545" y1="140" x2="648" y2="95" stroke="#4c8c58" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="545" y1="165" x2="648" y2="158" stroke="#4c8c58" stroke-width="1.5" marker-end="url(#arrowg)"/>
  <line x1="545" y1="195" x2="648" y2="222" stroke="#bf616a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrowr)"/>

  <!-- verifier lane -->
  <rect x="25" y="370" width="560" height="140" rx="10" fill="#f4ecf7" stroke="#b48ead" stroke-width="1.5"/>
  <text x="45" y="398" font-size="14" font-weight="600" fill="#2e3440">hidden verifier — the arms never see it</text>
  <text x="45" y="422" font-size="12" fill="#4c566a">21 binary checks over the final container state, in a fresh venv:</text>
  <text x="45" y="440" font-size="12" fill="#4c566a">five seeded trap families · ground truth measured from what the</text>
  <text x="45" y="458" font-size="12" fill="#4c566a">fixture builder actually built · proven fails-closed (stub: 21/21 fail)</text>
  <text x="45" y="476" font-size="12" fill="#4c566a">and fair (reference implementation: 21/21 pass) before any arm ran</text>

  <line x1="175" y1="300" x2="175" y2="368" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrowk)"/>
  <text x="188" y="340" font-size="11" fill="#4c566a">final state, scored after the run</text>

  <!-- noise band -->
  <rect x="650" y="370" width="195" height="140" rx="8" fill="#eceff4" stroke="#4c566a" stroke-width="1.5"/>
  <text x="747" y="398" text-anchor="middle" font-size="13" font-weight="600" fill="#2e3440">read against the</text>
  <text x="747" y="416" text-anchor="middle" font-size="13" font-weight="600" fill="#2e3440">noise band</text>
  <text x="747" y="440" text-anchor="middle" font-size="12" fill="#4c566a">5 fresh baselines:</text>
  <text x="747" y="458" text-anchor="middle" font-size="12" fill="#4c566a">18–20 / 21, mean 19.0</text>
  <text x="747" y="482" text-anchor="middle" font-size="12" fill="#4c566a">a score is a draw from a</text>
  <text x="747" y="498" text-anchor="middle" font-size="12" fill="#4c566a">distribution, not a truth</text>

  <line x1="585" y1="440" x2="648" y2="440" stroke="#4c566a" stroke-width="1.5" marker-end="url(#arrowk)"/>
</svg>
