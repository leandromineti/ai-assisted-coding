[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "logpeek"
version = "0.1.0"
description = "Summarize structured log files from the command line"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

[project.scripts]
logpeek = "logpeek.cli:main"

[tool.setuptools]
packages = ["logpeek"]

[project.optional-dependencies]
test = ["pytest"]
