[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "logpeek"
version = "0.1.0"
description = "Summarize structured log files from the command line"
readme = "README.md"
requires-python = ">=3.9"

[project.scripts]
logpeek = "logpeek.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
test = ["pytest"]
