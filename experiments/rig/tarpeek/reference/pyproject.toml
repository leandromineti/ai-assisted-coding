# APPARATUS, NOT A CONTESTANT — see README.md. Installs the `tarpeek` command for the
# fairness leg of the amendment-3 instrument proof only.
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tarpeek-reference"
version = "1.0.0"
description = "Hardened reference implementation of the exp-02 tarpeek task (instrument apparatus)"
requires-python = ">=3.10"

[project.scripts]
tarpeek = "tarpeek_reference:main"

[tool.setuptools]
py-modules = ["tarpeek_reference"]
