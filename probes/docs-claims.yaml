- param: temperature
  vendor: anthropic
  models: all
  documented_status: documented
  documented_name: temperature
  documented_type: number
  documented_range: 0.0 to 1.0 (deprecated)
  documented_allowed_values: null
  documented_default: '1.0'
  conditionality: 'Deprecated: models released after Claude Opus 4.6 do not support setting temperature.
    A value of 1.0 is accepted for backwards compatibility; all other values are rejected with a 400 error.'
  quote: 'Deprecated: Deprecated. Models released after Claude Opus 4.6 do not support setting temperature.
    A value of 1.0 of will be accepted for backwards compatibility, all other values will be rejected
    with a 400 error. ... Defaults to 1.0. Ranges from 0.0 to 1.0.'
  source_ref: anthropic-messages-api-ref
  searched_surface: null
  note: 'inventory.yaml''s own note for this row (retrieved 2026-08-26/2026-09-01) states OpenAI/Anthropic/most
    OpenAI-compatible vendors accept a 0-2 range — that assumption is superseded for Anthropic as of this
    claim''s 2026-09-02 retrieval: the documented range is now 0.0-1.0 (deprecated), non-1.0 values reject
    with 400 on newer models. Matches Phase 11''s own wire evidence (claude-fable-5 rejected temperature
    0.7 with HTTP 400) — a docs-corroborated finding, not a contradiction.'
- param: top-p
  vendor: anthropic
  models: all
  documented_status: documented
  documented_name: top_p
  documented_type: number
  documented_range: 0.0 to 1.0 (deprecated; only >=0.99 accepted for backwards compatibility)
  documented_allowed_values: null
  documented_default: null
  conditionality: 'Deprecated: models released after Claude Opus 4.6 do not support setting top_p. A value
    >= 0.99 is accepted for backwards compatibility; all other values are rejected with a 400 error.'
  quote: 'Deprecated: Deprecated. Models released after Claude Opus 4.6 do not support setting top_p.
    A value >= 0.99 will be accepted for backwards compatibility, all other values will be rejected with
    a 400 error.'
  source_ref: anthropic-messages-api-ref
  searched_surface: null
  note: Cross-references the same deprecation family as temperature and top_k (see the temperature claim's
    own note); inventory.yaml's own top-p row note assumed the broader 0-2 cross-vendor range, superseded
    here for Anthropic specifically.
