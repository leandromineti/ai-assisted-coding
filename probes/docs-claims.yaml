# probes/docs-claims.yaml — the first-party vendor-documentation claims registry
# (Phase 11.1, D-02). Opposite provenance from probes/inventory.yaml: this file is
# HAND-KEPT and rule-3 EXEMPT — it transcribes external references (vendor API
# docs pages), and nothing in-repo regenerates it. It is validated, not generated,
# by probes/check-docs-claims.py (D-03), which joins its own pre-commit lint
# battery gate (CLAUDE.md).
#
# One `sources:` entry per vendor docs page actually fetched and archived; one
# `claims:` entry per (probes/inventory.yaml row x in-scope vendor) pair — the
# claim records what that vendor's OWN docs say about that parameter, honestly,
# including absence. `documented_status` (rationale, mirroring
# probes/harness/models.yaml's per-field comment style): one of `documented` (the
# page states the parameter's contract), `absent-from-docs` (the parameter does
# not appear anywhere on the searched surface — rule 1b: an absence is only as
# good as the surface searched, so `searched_surface` is REQUIRED and must name
# the exact pages searched), or `docs-silent` (the parameter is listed but the
# page states nothing about range/default/conditionality). `searched_surface`
# (rationale): REQUIRED for every non-`documented` claim — the exact pages
# searched plus the date, never a bare "not found." `source_ref` (rationale): a
# `sources[].id`, never a bare URL — mirrors references/papers/'s
# citekey-as-primary-key pattern, so a claim's provenance survives even if a
# `sources:` entry's own fields are edited later.
#
# checked: 2026-09-02 — Phase 11.1 plan 01 (the tracer slice: schema + one
# archived source + the full Anthropic 51-row claim set, D-08's plan sketch).
checked: 2026-09-02
