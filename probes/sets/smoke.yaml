# probes/sets/smoke.yaml — one declared probe per wire family (D-03), proving every
# harness layer end-to-end (probe-set YAML -> runner -> adapter -> stdlib HTTP client
# -> per-vendor JSONL -> append-only ledger) across anthropic_messages, openai_compat
# and gemini before any other sweep spend. The first entry fired live in plan 09-01
# (Task 2's tracer) and its record already exists in probes/raw/anthropic.jsonl — it
# resume-skips on every subsequent run. The other two entries are added here by plan
# 09-02 but are NOT fired by this plan (dry-run only) — plan 09-03 owns their live
# calls, including Kimi's host-resolution probe (RESEARCH.md Pitfall B).
checked: 2026-09-01

probes:
  - model: claude-haiku-4-5
    param: baseline
    value: none
    mode: default
    prompt: "Reply with exactly one word: hello."
    max_tokens: 16

  - model: kimi-k3
    param: baseline
    value: none
    mode: default
    prompt: "Reply with exactly one word: hello."
    max_tokens: 16

  - model: gemini-3-1-pro
    param: baseline
    value: none
    mode: default
    prompt: "Reply with exactly one word: hello."
    max_tokens: 200   # 2026-09-01, plan 09-03 Task 1: raised from 16. A first live
      # fire at max_tokens=16 returned HTTP 200 with usageMetadata.thoughtsTokenCount=12,
      # candidatesTokenCount ABSENT, and an empty content object (finishReason:
      # MAX_TOKENS) — gemini-3.1-pro's always-on reasoning (report frontmatter:
      # reasoning_type: always-on, cannot be disabled) consumed the entire small
      # budget before any output text could be generated. A 200 with no real content
      # is exactly the rule-5e hazard this instrument exists to catch, not evidence
      # of a working smoke probe — the empty record was discarded (uncommitted,
      # gitignored probes/raw/, this same task) and re-fired at a budget large
      # enough to leave room for actual output after thinking.
