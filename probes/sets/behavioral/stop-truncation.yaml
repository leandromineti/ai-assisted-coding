# probes/sets/behavioral/stop-truncation.yaml — Phase 12 plan 12-04 Task 1's
# BHV-03 cells: does a `stop` sequence actually truncate the completion, and
# does the finish/stop-reason field say so honestly.
#
# A NEW prompt for this family (the contract sweep's own `stop` cell used a
# benign presence-only "reply with one word" prompt whose stop token was
# never at risk of appearing — re-firing it would produce no signal). This
# family instead asks for a short, highly predictable enumerated list — the
# days of the week, in order, starting Monday — and sets the stop sequence
# to "Thursday", the fourth item: virtually guaranteed to appear (assuming
# the model follows the instruction) and partway through the list, so a
# genuine truncation is measurable (the triggering call should stop mid-list,
# strictly shorter than an unstopped control run of the identical prompt).
#
# Two entries per model: a TRIGGERING call (the stop sequence set, in that
# wire family's own field name) and a non-triggering CONTROL call (identical
# prompt/budget, no stop parameter at all) — without the control there is no
# way to show the stop parameter itself, rather than the prompt or the
# budget, is what shortened the output (baseline-before-interaction).
#
# Wire-family field names for the stop-sequence parameter
# (probes/inventory.yaml's own `stop` row, confirmed against
# probes/classified/contract-sweep.yaml before authoring):
#   anthropic_messages -> stop_sequences
#   openai_compat      -> stop
#   gemini              -> stopSequences
#
# Fired at the 10 models whose `stop` cell is `accepted-unverified` in Phase
# 11 (probes/classified/contract-sweep.yaml, filtered param=stop):
# claude-fable-5, claude-opus-5, claude-sonnet-5, claude-haiku-4-5,
# gemini-3-1-pro, kimi-k3, deepseek-v4, glm-5.3, qwen3.8-max, qwen3.8-flash.
# gpt-5-6-sol and grok-4-5 both reject `stop` outright in Phase 11
# (`gpt-5-6-sol--stop--["the"]--default--6a86352a`,
# `grok-4-5--stop--["the"]--default--ee1a658f`, both HTTP 400) — declared
# skips below, cited, not fired.
#
# `max_tokens` per model: the same established, budget-corrected per-model
# values plan 12-03's temp0-repeatability.yaml already confirmed avoid the
# reasoning-length-exhaustion empty-completion failure (12-02/12-03's own
# read Run log entries) — reused verbatim here rather than re-deriving a
# fresh estimate for this shorter list-style prompt, since a larger,
# already-proven-safe budget is strictly conservative for a shorter task.
#
# Dated per CLAUDE.md's "Dates on everything" / "verify date before
# stamping": `date -u` at authoring time read 2026-09-03.
checked: 2026-09-05   # issue #43 roster fork: +gemini-3-8-flash +claude-fable-5-1 pairs, +gpt-6-astra wire-rejects skip (its contract stop cell 400s, the gpt-5-6-sol shape)

