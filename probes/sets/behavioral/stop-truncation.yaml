expectations:
  - model: claude-fable-5
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Anthropic documents stop_sequences as custom text sequences that cause
      the model to stop generating, with `stop_reason` set to
      "stop_sequence" when one is hit — the one wire family whose finish
      field can genuinely distinguish a triggered stop from a natural
      completion. Expect the triggering call to truncate strictly before
      "Thursday" and stop_reason to read "stop_sequence".
    expected_source: "docs-claims:stop/anthropic"
  - model: claude-opus-5
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Same Anthropic stop_sequences contract as claude-fable-5 — expect
      truncation before "Thursday" and an honest "stop_sequence" finish
      reason.
    expected_source: "docs-claims:stop/anthropic"
  - model: claude-sonnet-5
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Same Anthropic stop_sequences contract as claude-fable-5 — expect
      truncation before "Thursday" and an honest "stop_sequence" finish
      reason.
    expected_source: "docs-claims:stop/anthropic"
  - model: claude-haiku-4-5
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Same Anthropic stop_sequences contract as claude-fable-5 — expect
      truncation before "Thursday" and an honest "stop_sequence" finish
      reason.
    expected_source: "docs-claims:stop/anthropic"
  - model: gemini-3-1-pro
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Gemini documents stopSequences (up to 5) as stopping output at the
      first appearance of a stop_sequence, not included in the response.
      Gemini's shared `STOP` finishReason value is emitted for both a
      triggered stop and a natural completion, so the finish field alone
      cannot prove which happened here — the visible-text comparison against
      the control is the only evidence this family trusts for this vendor.
    expected_source: "docs-claims:stop/gemini"
  - model: kimi-k3
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Kimi documents stop words (max 5 strings, each <=32 bytes) that halt
      output when a full match is found, with the matched word itself not
      output. openai_compat's shared `stop` finish value is emitted for both
      a triggered stop and a natural completion — text comparison only.
    expected_source: "docs-claims:stop/kimi"
  - model: deepseek-v4
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      DeepSeek documents up to 16 stop sequences (four times OpenAI's/xAI's
      own documented ceiling for the same field name) where the API stops
      generating further tokens. openai_compat's shared `stop` finish value
      is ambiguous here too — text comparison only.
    expected_source: "docs-claims:stop/dseek"
  - model: glm-5.3
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Z.ai's stop-word field carries a genuine within-vendor contradiction
      (schema `maxItems: 4` vs. its own prose "only one stop word is
      supported") — this family fires exactly ONE sequence everywhere, so
      that contradiction is out of scope here (see the declared skip below)
      and only the single-sequence behavior is exercised. openai_compat's
      shared `stop` finish value is ambiguous — text comparison only.
    expected_source: "docs-claims:stop/zai"
  - model: qwen3.8-max
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Qwen documents stop words (string or array) that halt generation
      immediately on a match. openai_compat's shared `stop` finish value is
      ambiguous — text comparison only.
    expected_source: "docs-claims:stop/qwen"
  - model: qwen3.8-flash
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: "Thursday"
    expected: >-
      Same Qwen stop-word contract, shared across the qwen3.8 line — text
      comparison only.
    expected_source: "docs-claims:stop/qwen"

# Three declared skips: the two models that reject `stop` outright on the
# wire (cited to their own Phase 11 rejection probe_id), plus the one vendor
# whose documented schema maximum contradicts its own prose about how many
# stop words are supported — this family fires a single sequence everywhere,
# so that contradiction is never exercised; declared out of scope rather
# than silently absent, a candidate for a later phase.
  - model: gemini-3-8-flash
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: Thursday
    expected: >-
      Gemini documents stopSequences (up to 5) as stopping output at the first
      appearance of a stop sequence, not included in the response — the same
      vendor-level claim cited for gemini-3-1-pro above, now at the first
      Stable-track Gemini in the sweep. Expect the triggering call to truncate
      strictly before "Thursday" and the finish reason to distinguish the stop
      from the control's natural completion, per the sibling's own cell.
    expected_source: "docs-claims:stop/gemini"
  - model: claude-fable-5-1
    param: stop-truncation
    value: triggering
    mode: default
    requirement: BHV-03
    design: single-stop
    control_value: control-no-stop
    stop_token: Thursday
    expected: >-
      Anthropic documents stop_sequences as custom text sequences that cause
      the model to stop generating, with `stop_reason` set to "stop_sequence"
      when one fires — the same vendor-level claim cited for claude-fable-5
      above. The 5.0 predecessor measured honest (stop-honored truncation +
      the distinguishable stop_reason value); this cell is the revision
      test's like-for-like comparison at the same fixture.
    expected_source: "docs-claims:stop/anthropic"

