expectations:
  # ---------------------------- Group A (7 groups) ----------------------------
  - model: claude-haiku-4-5
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      Anthropic's own Messages API reference documents temperature as
      deprecated on newer Claude models (default 1.0, range 0.0-1.0), but
      Phase 11's own wire evidence shows claude-haiku-4-5 specifically
      ACCEPTING an explicit non-default temperature value in `default` mode
      (claude-haiku-4-5--temperature--0.7--default--a41444ed, HTTP 200) —
      unlike its three sibling Claude models, all of which reject it outright.
      Expect a high match rate (near or at 4/4) at temperature 0, the closest
      thing to a cross-vendor prior this check has (minimizing sampling
      variance).
    expected_source: "docs-claims:temperature/anthropic"
  - model: deepseek-v4
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      DeepSeek documents temperature word-for-word identical to OpenAI's own
      quote (range 0-2, default 1, "we generally recommend altering this or
      top_p but not both"), and Phase 11's own wire evidence shows
      deepseek-v4 ACCEPTING an explicit temperature value in `default` mode.
      Expect a high match rate (near or at 4/4) at temperature 0.
    expected_source: "docs-claims:temperature/dseek"
  - model: gemini-3-1-pro
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      Gemini's own GenerationConfig reference documents temperature range
      [0.0, 2.0] with no per-value rejection language, and Phase 11's own wire
      evidence shows gemini-3-1-pro ACCEPTING an explicit temperature value in
      `default` mode. Expect a high match rate (near or at 4/4) at
      temperature 0.
    expected_source: "docs-claims:temperature/gemini"
  - model: glm-5.3
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      Z.ai documents a narrower [0.0, 1.0] range specific to glm-5.3's own
      model series (default 1.0), conditional on `do_sample` staying true,
      and Phase 11's own wire evidence shows glm-5.3 ACCEPTING an explicit
      temperature value in `default` mode. Expect a high match rate (near or
      at 4/4) at temperature 0.
    expected_source: "docs-claims:temperature/zai"
  - model: grok-4-5
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      xAI documents temperature range 0-2 with no per-value rejection
      language, and Phase 11's own wire evidence shows grok-4-5 ACCEPTING an
      explicit temperature value in `default` mode. Expect a high match rate
      (near or at 4/4) at temperature 0.
    expected_source: "docs-claims:temperature/xai"
  - model: qwen3.8-max
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      Qwen documents temperature range [0, 2) with a caution to set only one
      of temperature/top_p, and Phase 11's own wire evidence shows
      qwen3.8-max ACCEPTING an explicit temperature value in `default` mode.
      Expect a high match rate (near or at 4/4) at temperature 0.
    expected_source: "docs-claims:temperature/qwen"
  - model: qwen3.8-flash
    param: temperature
    value: 0
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      Qwen's same temperature claim covers its flash-tier sibling
