# probes/sets/behavioral/temp0-repeatability.yaml — Phase 12 plan 12-03 Task 2's
# BHV-02 cells: temperature-0 repeatability, split by WHAT THE WIRE ACTUALLY
# SHOWS in `default` mode (probes/classified/contract-sweep.yaml, filtered to
# `param: temperature`/`mode: default`, confirmed against this file before
# authoring per this task's own read_first instruction) — not by the plan's own
# anticipated vendor-family split, which this file's own Flagged Assumptions
# section names as "this plan's expectation, not its authority."
#
# CORRECTION FROM THE PLAN'S OWN EXPECTED SPLIT (recorded here, per the plan's
# own instruction: "If the wire evidence puts any model in a different group
# than expected above, follow the evidence and record the correction in the Run
# log — do not follow this plan's expected split against the classified file"):
# `contract-sweep.yaml` shows gpt-5-6-sol AND kimi-k3 REJECTED for `temperature`
# in `default` mode (`gpt-5-6-sol--temperature--0.7--default--f4a07a21`,
# `kimi-k3--temperature--0.7--default--8d339aec`, both HTTP 400) — the plan's
# PLAN.md text anticipated both in "Group A." Wire evidence governs: both move
# to Group B (the default-config-repeatability substitute), alongside the three
# Claude models the plan's text DID anticipate there. Group A is therefore 7
# models (not 9), Group B is 5 (not 3) — still 60 calls total (12 models x 5
# repeats), matching the Measurements subsection's own call count, just
# redistributed 7+5 instead of 9+3.
#
# Group A — temperature ACCEPTED in `default` mode (7 models): claude-haiku-4-5
# (the one Claude model that accepts it — Mode scope's own named exception),
# deepseek-v4, gemini-3-1-pro, glm-5.3, grok-4-5, qwen3.8-max, qwen3.8-flash.
# Five `repeat: 1..5` entries each at `temperature: 0`.
#
# Group B — temperature REJECTED in `default` mode (5 models): claude-fable-5,
# claude-opus-5, claude-sonnet-5, gpt-5-6-sol, kimi-k3. Five `repeat: 1..5`
# entries each at `param: default-config-repeatability` — D-05's honest
# variant, no sampling parameter sent at all, asking what a caller can
# ACTUALLY request repeatably at these five models. Each also carries a
# `skips:` entry for its (never-fired-at-temp-0) temperature cell, citing its
# own Phase 11 rejection probe_id.
#
# `max_tokens` per model: the 7 already-established control-arm.yaml budgets
# (12-02-SUMMARY.md's own confirmed, budget-corrected values) reused verbatim
# for every model this file shares with that one; the 3 previously-unfired
# Claude models (claude-fable-5/opus-5/sonnet-5) get max_tokens: 300, derived
# from this task's own read of their REAL fired usage in probes/raw/
# anthropic.jsonl (Phase 10-11 baseline/max-tokens cells at max_tokens: 64
# already produced complete, non-empty visible text with only 0-13
# thinking_tokens consumed at every one of the three — comfortably inside a
# 300-token budget for this file's longer two-sentence creative prompt, and
# far below claude-fable-5's own $50/mtok output price making a much larger
# ceiling like kimi-k3/glm-5.3's 1200 an unnecessary cost risk with no
# evidence it is needed).
#
# Dated per CLAUDE.md's "Dates on everything" / "verify date before stamping":
# `date -u` at authoring time read 2026-09-03.
