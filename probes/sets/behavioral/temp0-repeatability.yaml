      Expect a high match rate (near or at 4/4) at temperature 0 at this
      smaller/cheaper model too.
    expected_source: "docs-claims:temperature/qwen"

  # ---------------------------- Group B (5 groups) ----------------------------
  - model: claude-fable-5
    param: default-config-repeatability
    value: no-temperature
    mode: default
    requirement: BHV-02
    design: repeats
    repeats: 5
    expected: >-
      Anthropic's own documented temperature contract explains why this
      model gets a substitute cell rather than a real temperature-0 cell:
      "models released after Claude Opus 4.6 do not support setting
      temperature ... all other values are rejected with a 400 error" —
      confirmed on the wire (claude-fable-5--temperature--0.7--default--be62cc19,
      HTTP 400). This default-config-repeatability cell instead asks whether
      claude-fable-5's own DEFAULT (implicit) sampling is repeatable across
      five identical requests with no temperature parameter sent at all — the
      closest behavioral question this model's own accepted request surface
