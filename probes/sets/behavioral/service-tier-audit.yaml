    value: omitted
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80

  # --- xAI (grok-4-5, openai_compat) — both documented values (default,
  #     priority) already contract-fired in Phase 11 (cited below); only the
  #     omission baseline is genuinely new here ---
  - model: grok-4-5
    param: service-tier-audit
    value: omitted
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80

  # --- Gemini (gemini-3-1-pro) — Phase 11 never fired service-tier at this
  #     vendor at all; all 4 documented enum values are genuinely new
  #     territory, plus 1 omission baseline. `top_level_params:` used
  #     throughout (see file header) since `extra_params` cannot reach the
  #     request top level for this family. `max_tokens: 80` per this file's
  #     own header note (presence-only design, always-on reasoning is not a
  #     confound for a usage-object-only read) — kept at 80 rather than the
  #     600 other behavioral files use for this always-on-reasoning model,
  #     deliberately, since no visible-text comparison is performed here.
  - model: gemini-3-1-pro
    param: service-tier-audit
    value: unspecified
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
    top_level_params: {serviceTier: unspecified}
  - model: gemini-3-1-pro
    param: service-tier-audit
    value: standard
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
