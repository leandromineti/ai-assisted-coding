expectations:
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: auto
    mode: default
    requirement: BHV-06
    design: tier-audit
    request_field: service_tier
    request_value: auto
    expected: >-
      Anthropic documents `service_tier` (auto/standard_only) as a REQUEST-
      side top-level field, and separately documents (anthropic-service-tiers
      source) that "the response `usage` object also includes the service
      tier assigned to the request" — i.e. the RESPONSE-side answer lives at
      `usage.service_tier`, nested, not at the response top level. This is
      the row that settles the asymmetry: expect a value present at
      `usage.service_tier` and ABSENT at the response top level.
    expected_source: "docs-claims:service-tier/anthropic"
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: standard_only
    mode: default
    requirement: BHV-06
    design: tier-audit
    request_field: service_tier
    request_value: standard_only
    expected: >-
      Anthropic's second documented request value, same nested
      `usage.service_tier` response location as the `auto` cell above.
    expected_source: "docs-claims:service-tier/anthropic"
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: omitted
    mode: default
    requirement: BHV-06
    design: tier-audit
    request_field: service_tier
    request_value: null
    expected: >-
      Anthropic documents `service_tier` as optional. Omitting it entirely
      is expected to still resolve to SOME assigned tier at
      `usage.service_tier` (the field's own documented purpose is reporting
      "the service tier assigned to the request", which happens whether or
      not the caller specified one) — a present value here is the field's
      own default, not a documented-absence refutation (Anthropic documents
      the field; only the four undocumented vendors' omission cells carry
      that framing).
    expected_source: "docs-claims:service-tier/anthropic"
