# probes/sets/behavioral/service-tier-audit.yaml — Phase 12 plan 12-05 Task 1's
# BHV-06 cells: audits the service-tier REQUEST-versus-RESPONSE vocabulary on
# the wire at all eight vendors, including the four whose docs say nothing
# about tiers at all (D-13's rule-1b negative prior IS the audited
# expectation there), and settles whether Anthropic's documented
# request/response field-location asymmetry (docs-claims.yaml's
# anthropic-service-tiers-sourced note on the `service-tier`/anthropic claim,
# amended in plan 12-01) is real by reading a live response body at the
# nested `usage.service_tier` location the contract classifier's own
# top-level-only `detect_echo()` never examines — the exact reason every
# Claude model's `service-tier` contract cell landed in the silent-acceptance
# (`accepted-ignored`) hazard class in Phase 11.
#
# Representative model per vendor (PREREGISTRATION.md's "Tier-audit scope"
# subsection, Q3 resolved): claude-haiku-4-5, gpt-5-6-sol, grok-4-5,
# gemini-3-1-pro, deepseek-v4, kimi-k3, glm-5.3, qwen3.8-flash. Per D-14, one
# vendor's audit = one request per documented request-enum value PLUS one
# request omitting the field entirely (the default-behavior baseline, and the
# WHOLE cell for the four undocumented vendors). Already-fired documented
# values are audited by reading their existing Phase 11 records via this
# file's own `cited_cells:` key (below), never re-fired (D-08).
#
# 17 new calls fired here (see PREREGISTRATION.md's own per-vendor table),
# plus 6 cells audited from existing Phase 11 evidence via `cited_cells:`.
#
# Gemini's request-field placement was resolved by reading
# ai.google.dev/api/generate-content directly (`date -u` at retrieval read
# 2026-09-03): `serviceTier` is documented as a TOP-LEVEL sibling field of
# `GenerateContentRequest` (alongside `contents`, `systemInstruction`,
# `generationConfig`, `cachedContent`, `store`) — NOT nested inside
# `GenerationConfig`'s own field list (confirmed by reading GenerationConfig's
# full field list separately: no `serviceTier` entry there). The current
# `extra_params` grammar therefore cannot express it (adapters/gemini.py's
# own `build_request()` merges `extra_params` INSIDE `generationConfig`) —
# this file uses the new additive `top_level_params:` entry key
# (probes/harness/runner.py, this plan's Task 1) for Gemini's four service-
# tier cells below. Gemini's own RESPONSE-side `serviceTier` is documented
# separately, nested inside `usageMetadata` (the same JSON object
# `parse_usage()` already reads `promptTokenCount`/`candidatesTokenCount`
# from) — a second request-top-level/response-nested asymmetry, structurally
# identical to Anthropic's own, though only Anthropic's is this plan's
# `must_haves` truth.
#
# `param: service-tier-audit` throughout (a new registry param — distinct
# from Phase 11's own `service-tier`/`openai-service-tier-values` rows, so no
# probe_id collides with an existing Phase 11 record even where the request
# body is byte-identical, e.g. Anthropic's own `auto` cell). `mode: default`,
# the D-04 prompt ("Invent a fictional animal and describe it in two
# sentences."), `max_tokens: 80` (PREREGISTRATION.md's own Envelope section:
# "80 tokens (BHV-06/D-07 — presence-only cells)") — this design reads the
# response's `usage`/top-level structure, never the visible completion text,
# so an always-on-reasoning model consuming its whole budget on reasoning
# (the glm-5.3/kimi-k3 empty-text bug plans 12-02/12-04 had to correct for)
# is not a confound here: the `usage` object and the `service_tier`/
# `serviceTier` field are populated by the vendor regardless of whether any
# visible text was produced.
#
# `cited_cells:` (this plan's own new set-file key, documented in
# scripts/classify-behavioral.py's Task 3 addition): audit rows that read an
# EXISTING Phase 11 record rather than firing a new one. Each entry carries
# the cell selector, `requirement`, `design`, `request_value` (mirrors what a
# `probes:` entry's own extra_params/top_level_params would have carried, so
# the SAME tier-audit reduction function can be applied uniformly to a fired
# OR a cited entry), `expected`, `expected_source`, and `cited_probe_id`
# naming the existing raw record. Six entries: OpenAI's 4 already-fired
# values (auto/default/flex/priority) and xAI's 2 already-fired values
# (default/priority) — read from probes/classified/contract-sweep.yaml,
# param in (service-tier, openai-service-tier-values), and resolving to a
# line in probes/raw/{openai,xai}.jsonl.
#
# Dated per CLAUDE.md's "Dates on everything" / "verify date before
# stamping": `date -u` at authoring time read 2026-09-03.
checked: 2026-09-05   # issue #43 roster fork: +12 audit cells (gpt-6-astra 3, gemini-3-8-flash 5, claude-fable-5-1's own 4 — direct revision evidence instead of the haiku remap)

probes:
  # --- Anthropic (claude-haiku-4-5, anthropic_messages — extra_params merges
  #     at the request top level; response-side reads at usage.service_tier
  #     per the docs-claims.yaml amendment plan 12-01 made) ---
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: auto
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
    extra_params: {service_tier: auto}
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: standard_only
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
    extra_params: {service_tier: standard_only}
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: omitted
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
  # D-15's trap: `standard` is a RESPONSE-side vocabulary word
  # (`usage.service_tier` resolves to "standard"/"priority"/"batch" per the
  # anthropic-service-tiers source), never a documented REQUEST value
  # (`auto`/`standard_only` only) — sent here as the request value itself.
  # Expected: HTTP 400 naming the field (a $0 rejection).
  - model: claude-haiku-4-5
    param: service-tier-audit
    value: trap
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
    extra_params: {service_tier: standard}

  # --- OpenAI (gpt-5-6-sol, openai_compat) — 2 genuinely new documented
  #     values (scale, fast) beyond the 4 already fired in Phase 11
  #     (auto/default/flex/priority, cited below), + 1 omission baseline ---
  - model: gpt-5-6-sol
    param: service-tier-audit
    value: scale
    mode: default
    prompt: "Invent a fictional animal and describe it in two sentences."
    max_tokens: 80
    extra_params: {service_tier: scale}
  - model: gpt-5-6-sol
