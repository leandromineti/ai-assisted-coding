# probes/sets/behavioral/seed-determinism.yaml — Phase 12 plan 12-03 Task 1's
# BHV-01 cells: five disjoint same-seed pairs (D-01's sample-size decision, D-06's
# pair-plus-effect-control design) at the eight models Phase 11's own contract
# evidence shows accepting a request-side `seed` field in `default` mode
# (probes/classified/contract-sweep.yaml, confirmed against this file before
# authoring, per this task's own read_first instruction):
#
#   gpt-5-6-sol--seed--42--default--77f68fc6      (accepted-unverified)
#   gemini-3-1-pro--seed--42--default--18c16086   (accepted-unverified)
#   grok-4-5--seed--42--default--89d4c1d4         (accepted-unverified)
#   kimi-k3--seed--42--default--992d750b          (accepted-unverified)
#   deepseek-v4--seed--42--default--4176a0f2      (accepted-unverified)
#   glm-5.3--seed--42--default--f05c74a2          (accepted-unverified)
#   qwen3.8-max--seed--42--default--5c475384      (accepted-unverified)
#   qwen3.8-flash--seed--42--default--1fd7386e    (accepted-unverified)
#
# Per model: TEN `repeat: 1..10` entries at `seed: 42` (the same value Phase 11's
# own contract cell above already used) — byte-identical request bodies, `repeat`
# the only thing making them 10 distinct probe_ids (D-09) — reduced by
# scripts/classify-behavioral.py (Task 3, `design: seed-pairs`) into FIVE
# disjoint pairs: (r1,r2) (r3,r4) (r5,r6) (r7,r8) (r9,r10), never a flat
# ten-way comparison against repeat 1 (the Measurements subsection's own
# resolution of what a "pair" means for this design, distinct from the
# `repeats` design's baseline-vs-N comparison used by BHV-02/D-03). Plus ONE
# further entry at `seed: 99` (D-06's effect control) — a genuinely different
# request body, no `repeat` key needed since the changed `value` already
# produces a distinct probe_id (D-04) — comparing its visible text against
# repeat 1's: if a DIFFERENT seed still reproduces the same text, the observed
# same-seed stability is not seed-driven at all.
#
# No `temperature` parameter anywhere in this file (Sampling configuration:
# control-arm/seed cells rely on each vendor's own nonzero default — sending an
# explicit temperature would break the 3-of-4 Claude models that reject it
# outright for no reason related to seed determinism; moot here anyway, since
# none of the four Claude models has a request-side seed field at all — see
# `skips:` below).
#
# `max_tokens` reused verbatim from control-arm.yaml's own confirmed,
# budget-corrected per-model values (12-02-SUMMARY.md's glm-5.3/kimi-k3 fix) —
# this task's own read_first names that file as the source of "confirmed
# output budget," not a fresh assumption.
#
# Dated per CLAUDE.md's "Dates on everything" / "verify date before stamping":
# `date -u` at authoring time read 2026-09-03.
checked: 2026-09-03

