# `effect_control_value: 99` on every expectation below tells
# scripts/classify-behavioral.py (Task 3) where to find this model's single
# different-seed probe entry (group_key (model, "seed", 99, "default")) — the
# `design: seed-pairs` reduction joins it separately from the ten-repeat
# same-seed group (`value: 42`) that this expectation's own group_key matches,
# since a same-`value` group_key match is what `probes:`/`expectations:`
# pairing already requires everywhere else in this pipeline (12-02's own
# grammar). Eight expected values, each written for that vendor's own
# documented seed contract individually (12-RESEARCH.md Pitfall 4) — never one
# shared best-effort sentence.
expectations:
  - model: gpt-5-6-sol
    param: seed
    value: 42
    mode: default
    requirement: BHV-01
    design: seed-pairs
    pairs: 5
    calls: 10
    effect_control_value: 99
    expected: >-
      OpenAI documents seed as an explicit best-effort determinism feature at
      gpt-5-6-sol's own vendor: "our system will make a best effort to sample
      deterministically, such that repeated requests with the same seed and
      parameters should return the same result. Determinism is not guaranteed,
      and you should refer to the system_fingerprint response parameter to
      monitor changes in the backend." Expect a mid-to-high same-seed pair-match
      rate, not a guaranteed 5/5, with each pair's system_fingerprint recorded
      alongside it for exactly the drift-monitoring purpose the vendor's own
      hedge names.
    expected_source: "docs-claims:seed/openai"
  - model: gemini-3-1-pro
    param: seed
    value: 42
    mode: default
    requirement: BHV-01
    design: seed-pairs
