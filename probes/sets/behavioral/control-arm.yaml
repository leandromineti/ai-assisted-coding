# probes/sets/behavioral/control-arm.yaml — Phase 12 plan 12-02's D-03 calibration
# control arm: one high-entropy prompt fired 5 times (repeat: 1..5) per applicable
# model, expected to VARY across repeats. Implements CONTEXT.md D-03 (the
# calibration-arm-first discipline, rule 5d — a determinism test against a prompt
# with no entropy for a given model measures nothing) and D-04 (the prompt/budget
# design), and the Phase 12 preregistration's own Sampling configuration statement
# (probes/PREREGISTRATION.md § "Phase 12 — Cheap Behavioral Verification"): control-
# arm cells send NO `temperature` parameter at all — they rely on each vendor's own
# nonzero default, which is what makes a control arm's own variation (or lack of it)
# meaningful evidence about the DEFAULT sampling behavior, not about an explicit
# temperature this file never sets.
#
# Only the `probes:` key is read by probes/harness/runner.py (D-09's `repeat`
# coordinate, landed 12-01). `expectations:` and `skips:` are read by
# scripts/classify-behavioral.py — the runner never opens either key, matching
# probes/sets/contract-zero-cost.yaml's own header-comment convention for a
# hand-authored set file (12-02 read_first).
#
# Task 1 (this file's first commit) declared ONLY claude-haiku-4-5's 5-repeat
# control group — the tracer slice that proved the whole pipeline (probe set ->
# runner -> probes/raw/anthropic.jsonl -> classify-behavioral.py ->
# probes/classified/behavioral.yaml -> comparisons/behavioral.md) end to end on one
# cheap cell before the arm expanded.
#
# Task 2 (this commit) expands to the other 8 applicable models — nine models
# total. The other 3 Claude models (claude-fable-5, claude-opus-5, claude-sonnet-5)
# are DELIBERATELY ABSENT: their D-05 default-config repeatability cell in plan
# 12-03 is itself their own baseline arm (no separate control need — see the Phase
# 12 preregistration's own Measurements section, "D-03 control-arm cell").
#
# Per-model `max_tokens` is set generously above the shared ~100-token family
# baseline for every model whose `reasoning_toggle` in probes/harness/models.yaml
# is `always-on` or `default-on` (gemini-3-1-pro, grok-4-5, kimi-k3, glm-5.3:
# always-on; gpt-5-6-sol, deepseek-v4, qwen3.8-max, qwen3.8-flash: default-on) —
# the Phase 9 Gemini lesson (a too-small budget yields HTTP 200 with EMPTY visible
# content at an always-reasoning model, a silent null result, not a rejection).
# Confirmed from the fired records themselves, not the HTTP status alone, per this
# task's own action text.
#
# Dated per CLAUDE.md's "Dates on everything" and the standing "verify date before
# stamping" discipline: `date -u` at authoring time read 2026-09-03, not the
# 2026-09-02 literal PLAN.md's action text names (a planning-day date literal, the
# same class of mismatch 12-01-SUMMARY.md already documented and corrected) —
# recorded as a deviation in 12-02-SUMMARY.md, not silently reproduced.
#
# Budget correction, same session (Task 2): the first live fire at max_tokens: 600
# for kimi-k3 and glm-5.3 hit the Phase 9 Gemini lesson directly — both models'
# reasoning consumed the ENTIRE budget before any visible text (glm-5.3: 5/5
# empty, finish_reason "length", 597-600 reasoning_tokens; kimi-k3: 3/5 empty the
# same way, 2/5 succeeded when reasoning finished under ~520 tokens). Both raised
# to max_tokens: 1200 (reasoning headroom ~600 + a two-sentence answer ~100-300).
# The old 600-token request bodies are a DIFFERENT canonical body -> a DIFFERENT
# probe_id hash (D-04) -> their 10 empty-text records remain on disk, unmodified
# (append-only, rule 3), and are simply never joined by the classifier (no
# declared cell cites their probe_id) — historical evidence of the pre-fix
# no-signal attempt, not a re-fire or overwrite of anything.
checked: 2026-09-03

