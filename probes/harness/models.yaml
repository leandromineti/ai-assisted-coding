# probes/harness/models.yaml — the sole source of truth for wire facts across the 15
# active tracked models (D-01; 12 at Phase 11, +3 on 2026-09-04 by issue #43's
# roster fork). Self-contained: never parses tools/1-models/ prose at
# runtime; a drift check against the reports' active-model set is deliberately
# deferred to Phase 13's check-probe-drift.py.
#
# `vendor` is a lowercased short name derived mechanically from each model's
# key_env_var infix (PERSONAL_<VENDOR>_KEY) — the one naming convention already fixed
# by this repo's local secrets convention before this phase existed — and is what
# partitions probes/raw/{vendor}.jsonl (D-08, 8 files for 8 makers).
#
# `reasoning_toggle` (added 2026-09-01, Phase 10 plan 10-01, D-06): closed enum
# always-on | default-on | opt-in | none, transcribed verbatim from each model's own
# report frontmatter `model_features.reasoning_type` in tools/1-models/<slug>.md, read
# 2026-09-01. Deliberately a docs-grade duplicate the harness owns (matching this
# file's own self-containment note above) — never parsed from the reports at runtime.
# Phase 13's check-probe-drift.py later confronts this field against the reports'
# `reasoning_type` key (string equality, not a mapping, since this file reuses the
# reports' own four-value enum instead of D-06's proposed three classes).
checked: 2026-09-04

models:
  - slug: claude-fable-5
    maker: Anthropic
    vendor: anthropic
    wire_family: anthropic_messages
    api_model_id: claude-fable-5
    base_url: https://api.anthropic.com/v1
    key_env_var: PERSONAL_ANTHROPIC_KEY
    reasoning_toggle: always-on

  - slug: claude-opus-5
    maker: Anthropic
    vendor: anthropic
    wire_family: anthropic_messages
    api_model_id: claude-opus-5
    base_url: https://api.anthropic.com/v1
    key_env_var: PERSONAL_ANTHROPIC_KEY
    reasoning_toggle: default-on   # 2026-09-01: the report marks toggleability as
      # CONDITIONAL on effort level — accepts thinking:{type:"disabled"} only at
      # effort <= high; xhigh/max + disabled returns 400 (tools/1-models/claude-opus-5.md
      # § Reasoning surface, "Opus 5 is the sweep's only conditionally-toggleable
      # model, and it strains the enum"). This flat default-on value is a
      # simplification the sweep itself may refute at the thinking-toggle axis rows.

  - slug: claude-sonnet-5
    maker: Anthropic
    vendor: anthropic
    wire_family: anthropic_messages
    api_model_id: claude-sonnet-5
    base_url: https://api.anthropic.com/v1
    key_env_var: PERSONAL_ANTHROPIC_KEY
    reasoning_toggle: default-on

  - slug: claude-haiku-4-5
    maker: Anthropic
    vendor: anthropic
    wire_family: anthropic_messages
    api_model_id: claude-haiku-4-5-20251001   # dated snapshot suffix — unlike the
                                                # other 3 Claude ids above, which are
                                                # undated aliases
    base_url: https://api.anthropic.com/v1
    key_env_var: PERSONAL_ANTHROPIC_KEY
    reasoning_toggle: opt-in

  - slug: gpt-5-6-sol
    maker: OpenAI
    vendor: openai
    wire_family: openai_compat
    api_model_id: gpt-5.6-sol
    base_url: https://api.openai.com/v1
    key_env_var: PERSONAL_OPENAI_KEY
    reasoning_toggle: default-on
    max_tokens_field: max_completion_tokens   # 2026-09-01, Phase 11 plan 11-04,
      # D-09 "fix-before-fire": this model rejects the openai_compat family's
      # default `max_tokens` field outright — calibration-batch 400: "Unsupported
      # parameter: 'max_tokens' is not supported with this model. Use
      # 'max_completion_tokens' instead." (`param: "max_tokens"` in the error
      # JSON, probes/PREREGISTRATION.md Run log, plan 11-04 Task 1 Stage 2).
      # Consumed by probes/harness/runner.py's apply_max_tokens_field_override()
      # — a per-model request-field rename applied AFTER adapter.build_request(),
      # deliberately outside openai_compat.py (whose own docstring forbids a
      # per-vendor/per-model conditional inside the adapter itself). Every other
      # model in this file omits the field and is unaffected (no-op).

  - slug: gemini-3-1-pro
    maker: Google
    vendor: gemini
    wire_family: gemini
    api_model_id: gemini-3.1-pro-preview   # 2026-09-01, plan 09-03 Task 1: the bare
      # id 404s ("models/gemini-3.1-pro is not found ... or is not supported for
      # generateContent"). RESEARCH.md's assumption — that the report frontmatter's
      # "(Preview)" suffix is display-only and the API path segment is the bare id —
      # is WRONG for this still-Preview model: `GET /v1beta/models` (zero-cost
      # ListModels call, ~$0) lists it as `models/gemini-3.1-pro-preview`. Contradicts
      # RESEARCH.md § Google — Gemini generateContent family; recorded as a finding.
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env_var: PERSONAL_GEMINI_KEY
    reasoning_toggle: always-on

  - slug: grok-4-5
    maker: xAI
    vendor: xai
    wire_family: openai_compat
    api_model_id: grok-4.5   # WITH A DOT — grok-4-5 with a dash 404s as
                               # model-not-found; the dash form only appears in doc
                               # URLs/slugs (RESEARCH.md, [CITED])
    base_url: https://api.x.ai/v1
    key_env_var: PERSONAL_XAI_KEY
    reasoning_toggle: always-on

  - slug: kimi-k3
    maker: Moonshot AI
    vendor: kimi
    wire_family: openai_compat
    api_model_id: kimi-k3
    base_url: https://api.moonshot.ai/v1   # SETTLED 2026-09-01, plan 09-03 Task 1's
      # live probe (probe_id kimi-k3--baseline--none--default--b3540b5c): fired
      # against api.moonshot.ai/v1/chat/completions and answered directly with
      # HTTP 200 on the first attempt — no DNS/connection failure, no fallback
      # needed. api.moonshot.ai is the real API host; the console-domain rebrand
      # to platform.kimi.ai (conclusion 19) did NOT carry the API host with it.
    fallback_base_url: https://api.kimi.ai/v1   # kept as a documented
      # tried-and-unneeded candidate — RESEARCH.md Pitfall B's second, less-cited
      # source was wrong for the API host (still correct that the CONSOLE domain
      # rebranded); never tried live since the primary host answered cleanly.
    key_env_var: PERSONAL_KIMI_KEY
    reasoning_toggle: always-on

  - slug: deepseek-v4
    maker: DeepSeek
    vendor: dseek
    wire_family: openai_compat
    api_model_id: deepseek-v4-pro   # 2026-09-01: this ONE row represents BOTH
      # DeepSeek API model ids — tools/1-models/deepseek-v4.md is one report but
      # names two API-callable ids (deepseek-v4-pro, deepseek-v4-flash).
      # deepseek-v4-flash is an available sibling, NOT separately tracked here
      # (RESEARCH.md Open Question 1, resolved to its own recommendation) — this
      # is what kept this file at 12 rows matching the then-"12 active models"
      # rather than silently becoming 13 (15 rows since the 2026-09-04 fork —
      # the one-row-per-report decision itself is unchanged).
    base_url: https://api.deepseek.com
    key_env_var: PERSONAL_DSEEK_KEY
    reasoning_toggle: default-on

  - slug: glm-5.3
    maker: Z.ai (Zhipu AI)
    vendor: zai
    wire_family: openai_compat
    api_model_id: glm-5.3
    base_url: https://api.z.ai/api/paas/v4
    key_env_var: PERSONAL_ZAI_KEY
    reasoning_toggle: always-on

  - slug: qwen3.8-max
    maker: Alibaba (Qwen team)
    vendor: qwen
    wire_family: openai_compat   # DashScope International, "compatible-mode"
    api_model_id: qwen3.8-max
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    key_env_var: PERSONAL_QWEN_KEY   # 2026-09-01: DashScope keys are
      # region-specific — a China-region key returns a 401 against this
      # International endpoint that is indistinguishable from a bad key
      # (RESEARCH.md, [CITED]).
    reasoning_toggle: default-on

  - slug: qwen3.8-flash
    maker: Alibaba (Qwen team)
    vendor: qwen
    wire_family: openai_compat   # DashScope International, "compatible-mode"
    api_model_id: qwen3.8-flash
    base_url: https://dashscope-intl.aliyuncs.com/compatible-mode/v1
    key_env_var: PERSONAL_QWEN_KEY
    reasoning_toggle: default-on

  # --- issue #43 phase 2 roster fork (2026-09-04): the three September launches,
  # appended as one batch so the probe envelope forks once. Slugs equal the report
  # filename stems in tools/1-models/ (check-probe-drift.py joins on exactly that).
  - slug: gpt-6-astra
    maker: OpenAI
    vendor: openai
    wire_family: openai_compat
    api_model_id: gpt-6-astra
    base_url: https://api.openai.com/v1
    key_env_var: PERSONAL_OPENAI_KEY
    reasoning_toggle: always-on   # tools/1-models/gpt-6-astra.md, verified
      # 2026-09-04: `reasoning_effort: none` returns HTTP 400 on this model, and
      # the system card states the withholding is deliberate ("we do not currently
      # have plans to make reasoning=None available").
    max_tokens_field: max_completion_tokens   # 2026-09-04, issue #43 gate probe:
      # the one-shot completion that opened the batch sent max_completion_tokens
      # and answered HTTP 200 (finish_reason: stop) — same rename gpt-5-6-sol's
      # D-09 calibration forced, here settled before first fire.

  - slug: gemini-3-8-flash
    maker: Google
    vendor: gemini
    wire_family: gemini
    api_model_id: gemini-3.8-flash   # bare id, NO -preview suffix — the same
      # zero-cost ListModels call that caught gemini-3.1-pro-preview's suffix
      # (above) lists this one as `models/gemini-3.8-flash` (2026-09-04); the
      # model is badged "New Stable", so no Preview path segment exists. The
      # adapter prepends `models/`.
    base_url: https://generativelanguage.googleapis.com/v1beta
    key_env_var: PERSONAL_GEMINI_KEY
    reasoning_toggle: always-on   # thinking docs table, verified 2026-09-04:
      # "gemini-3.8-flash | On (medium) | low, medium, high" — no off state and
      # no `minimal` level (the 3.5-flash floor was dropped).

  - slug: claude-fable-5-1
    maker: Anthropic
    vendor: anthropic
    wire_family: anthropic_messages
    api_model_id: claude-fable-5-1
    base_url: https://api.anthropic.com/v1
    key_env_var: PERSONAL_ANTHROPIC_KEY
    reasoning_toggle: always-on   # per-model troubleshooting table, verified
      # 2026-09-04: "Adaptive only | Always on", rejects BOTH `"enabled"` and
      # `"disabled"` with a 400 — the same strictest row claude-fable-5 holds;
      # its slug-keyed thinking-shape override lives beside claude-fable-5's in
      # probes/inventory.yaml.
# The superseded Qwen coder entry (see tools/1-models/README.md's own superseded
# note) is deliberately absent from this list — never re-added without a fresh
# owner decision.
